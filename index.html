<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

  <!-- APP CONTAINER -->
  <div class="max-w-md mx-auto min-h-screen bg-white flex flex-col justify-between shadow-lg relative pb-16">
    
    <!-- HEADER -->
    <header class="bg-blue-600 text-white p-4 text-center rounded-b-2xl shadow-md">
      <h1 class="text-xl font-bold tracking-wide">E-ABSENSI ONLINE</h1>
      <p id="serverClock" class="text-xs font-semibold text-blue-100 mt-1">Server: --:--:--</p>
    </header>

    <!-- CONTENT BODY -->
    <main class="p-4 flex-1">

      <!-- SECTION: LOGIN -->
      <div id="secLogin" class="space-y-4 my-auto">
        <h2 class="text-2xl font-bold text-center text-blue-600">Masuk Akun</h2>
        <div>
          <label class="block text-sm font-medium mb-1">NIK (16 Digit)</label>
          <input type="number" id="loginNik" placeholder="Masukkan 16 digit NIK" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <div class="relative">
            <input type="password" id="loginPass" placeholder="Masukkan Password" class="w-full border rounded-lg p-2.5 pr-10 focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="button" onclick="togglePass('loginPass', 'eyeLogin')" class="absolute right-3 top-3 text-gray-500">
              <i id="eyeLogin" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button onclick="doLogin()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold shadow hover:bg-blue-700 transition">MASUK</button>
      </div>

      <!-- SECTION: HOME -->
      <div id="secHome" class="hidden space-y-4">
        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 shadow-sm text-center">
          <h3 id="uNama" class="text-lg font-bold text-blue-900">Nama User</h3>
          <p id="uUnit" class="text-sm text-blue-600 font-medium">Unit Kerja</p>
          <p id="uTanggal" class="text-xs text-gray-500 mt-1">dd-MM-yyyy</p>
          <div id="liveClock" class="text-4xl font-extrabold text-blue-700 my-2">00:00:00</div>
          <div class="flex justify-around mt-3 text-sm">
            <div class="bg-white p-2 rounded-lg shadow-sm w-5/12">
              <span class="block text-xs text-gray-400">Masuk</span>
              <strong id="timeMasuk" class="text-green-600 text-base">--:--:--</strong>
            </div>
            <div class="bg-white p-2 rounded-lg shadow-sm w-5/12">
              <span class="block text-xs text-gray-400">Pulang</span>
              <strong id="timePulang" class="text-red-600 text-base">--:--:--</strong>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1 text-gray-700">Peta & Lokasi GPS</label>
          <div id="map" class="h-44 w-full rounded-xl border"></div>
          <p id="geoStatus" class="text-xs text-gray-500 mt-1">Mendapatkan koordinat GPS...</p>
        </div>
      </div>

      <!-- SECTION: CAMERA & ABSEN -->
      <div id="secAbsen" class="hidden space-y-4 text-center">
        <h3 class="text-lg font-bold">Verifikasi Face Selfie</h3>
        <div class="relative w-full h-64 bg-black rounded-xl overflow-hidden flex items-center justify-center">
          <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
          <canvas id="canvas" class="hidden"></canvas>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <button onclick="takeAbsen('masuk')" class="bg-green-600 text-white py-3 rounded-xl font-bold shadow hover:bg-green-700 transition">
            <i class="fa-solid fa-right-to-bracket mr-1"></i> JAM MASUK
          </button>
          <button onclick="takeAbsen('pulang')" class="bg-red-600 text-white py-3 rounded-xl font-bold shadow hover:bg-red-700 transition">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> JAM PULANG
          </button>
        </div>
      </div>

      <!-- SECTION: REKAP -->
      <div id="secRekap" class="hidden space-y-3">
        <h3 class="text-lg font-bold text-center">Rekap Presensi Saya</h3>
        <div id="rekapList" class="space-y-2 max-h-[60vh] overflow-y-auto">
          <!-- Item rekap di-inject javascript -->
        </div>
      </div>

      <!-- SECTION: SETTING -->
      <div id="secSetting" class="hidden space-y-4">
        <h3 class="text-lg font-bold text-center">Pengaturan Password</h3>
        <div>
          <label class="block text-sm font-medium mb-1">Password Lama</label>
          <input type="password" id="oldPass" class="w-full border rounded-lg p-2.5 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password Baru</label>
          <div class="relative">
            <input type="password" id="newPass" class="w-full border rounded-lg p-2.5 pr-10 outline-none">
            <button type="button" onclick="togglePass('newPass', 'eyeNew')" class="absolute right-3 top-3 text-gray-500">
              <i id="eyeNew" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button onclick="doChangePass()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">SIMPAN PASSWORD</button>
      </div>

    </main>

    <!-- BOTTOM NAVBAR -->
    <nav id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around p-2 text-gray-500 text-xs">
      <button onclick="showNav('secHome')" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-house text-lg"></i>
        <span>Home</span>
      </button>
      <button onclick="showNav('secRekap')" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
        <span>Rekap</span>
      </button>
      <button onclick="showNav('secAbsen')" class="flex flex-col items-center text-blue-600">
        <div class="bg-blue-600 text-white p-3 rounded-full -mt-6 shadow-lg border-2 border-white">
          <i class="fa-solid fa-fingerprint text-xl"></i>
        </div>
        <span>Absen</span>
      </button>
      <button onclick="showNav('secSetting')" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-gear text-lg"></i>
        <span>Setting</span>
      </button>
      <button onclick="doLogout()" class="flex flex-col items-center text-red-500">
        <i class="fa-solid fa-power-off text-lg"></i>
        <span>Keluar</span>
      </button>
    </nav>

  </div>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    // GANTI URL INI DENGAN DEPLOYMENT URL GOOGLE APPS SCRIPT ANDA
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";

    let currentUser = null;
    let currentLat = 0, currentLng = 0;
    let map = null, marker = null;
    let videoStream = null;
    let serverTimeOffset = 0;

    window.onload = function() {
      syncServerTime();
      initGPS();
      checkAutoRefresh();
      setInterval(updateClocks, 1000);
    };

    // Toggle Password Visibility
    function togglePass(inputId, eyeId) {
      const inp = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (inp.type === "password") {
        inp.type = "text";
        eye.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        inp.type = "password";
        eye.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Call API GAS
    async function apiPost(payload) {
      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        return await res.json();
      } catch (err) {
        alert("Gagal terhubung ke server: " + err.message);
        return { success: false };
      }
    }

    // Sync Jam Server
    async function syncServerTime() {
      const res = await apiPost({ action: "getServerTime" });
      if (res.success) {
        document.getElementById("serverClock").innerText = "Server: " + res.time;
      }
    }

    // Clock updates
    function updateClocks() {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      document.getElementById("liveClock").innerText = timeStr;
    }

    // Get User Geolocation
    function initGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition((pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          document.getElementById("geoStatus").innerText = `Lat: ${currentLat.toFixed(5)}, Lng: ${currentLng.toFixed(5)}`;
          if (map) updateMap(currentLat, currentLng);
        }, (err) => {
          document.getElementById("geoStatus").innerText = "Aktifkan GPS perangkat Anda!";
        }, { enableHighAccuracy: true });
      }
    }

    // Init Leaflet Map
    function initMap(lat, lng) {
      if (!map) {
        map = L.map('map').setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.marker([lat, lng]).addTo(map);
      } else {
        updateMap(lat, lng);
      }
    }

    function updateMap(lat, lng) {
      if (map && marker) {
        marker.setLatLng([lat, lng]);
        map.panTo([lat, lng]);
      }
    }

    // Login Action
    async function doLogin() {
      const nik = document.getElementById("loginNik").value;
      const pass = document.getElementById("loginPass").value;

      if (!nik || !pass) return alert("Isi NIK dan Password!");

      const res = await apiPost({ action: "login", nik: nik, password: pass });
      if (res.success) {
        currentUser = res.user;
        document.getElementById("uNama").innerText = currentUser.nama;
        document.getElementById("uUnit").innerText = currentUser.unitKerja;
        
        const now = new Date();
        document.getElementById("uTanggal").innerText = `${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()}`;

        document.getElementById("secLogin").classList.add("hidden");
        document.getElementById("bottomNav").classList.remove("hidden");
        showNav('secHome');
        initMap(currentLat || currentUser.targetLat, currentLng || currentUser.targetLng);
      } else {
        alert(res.message);
      }
    }

    // Navigation Switcher
    function showNav(secId) {
      ["secHome", "secAbsen", "secRekap", "secSetting"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      document.getElementById(secId).classList.remove("hidden");

      if (secId === "secAbsen") startCamera(); else stopCamera();
      if (secId === "secRekap") loadRekap();
      if (secId === "secHome" && map) setTimeout(() => map.invalidateSize(), 300);
    }

    // Camera Handler
    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById("webcam").srcObject = videoStream;
      } catch (err) {
        alert("Gagal mengakses kamera depan!");
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
    }

    // Take Selfie Base64 & Send Absen
    async function takeAbsen(type) {
      if (!currentLat || !currentLng) return alert("Mendapatkan titik GPS... Mohon tunggu!");

      const video = document.getElementById("webcam");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = canvas.toDataURL("image/jpeg", 0.6);

      const res = await apiPost({
        action: "absen",
        nik: currentUser.nik,
        type: type,
        lat: currentLat,
        lng: currentLng,
        image: imgData
      });

      alert(res.message);
      if (res.success) {
        if (type === "masuk") document.getElementById("timeMasuk").innerText = res.time;
        if (type === "pulang") document.getElementById("timePulang").innerText = res.time;
        showNav("secHome");
      }
    }

    // Rekap Data
    async function loadRekap() {
      const container = document.getElementById("rekapList");
      container.innerHTML = "<p class='text-center text-sm text-gray-500'>Memuat rekap...</p>";
      
      const res = await apiPost({ action: "getRekap", nik: currentUser.nik });
      if (res.success) {
        container.innerHTML = "";
        if(res.data.length === 0) {
          container.innerHTML = "<p class='text-center text-sm text-gray-500'>Belum ada data presensi.</p>";
          return;
        }
        res.data.forEach(item => {
          container.innerHTML += `
            <div class="p-3 bg-gray-50 rounded-lg border text-sm flex justify-between items-center">
              <div>
                <strong class="block text-gray-800">${item.tanggal}</strong>
                <span class="text-xs text-gray-500">Masuk: ${item.jamMasuk} | Pulang: ${item.jamPulang}</span>
              </div>
              <i class="fa-solid fa-circle-check text-green-500"></i>
            </div>
          `;
        });
      }
    }

    // Change Password
    async function doChangePass() {
      const oldP = document.getElementById("oldPass").value;
      const newP = document.getElementById("newPass").value;
      if (!oldP || !newP) return alert("Isi password lama dan baru!");

      const res = await apiPost({ action: "changePassword", nik: currentUser.nik, oldPassword: oldP, newPassword: newP });
      alert(res.message);
      if (res.success) {
        document.getElementById("oldPass").value = "";
        document.getElementById("newPass").value = "";
      }
    }

    // Logout
    function doLogout() {
      currentUser = null;
      stopCamera();
      document.getElementById("secHome").classList.add("hidden");
      document.getElementById("secAbsen").classList.add("hidden");
      document.getElementById("secRekap").classList.add("hidden");
      document.getElementById("secSetting").classList.add("hidden");
      document.getElementById("bottomNav").classList.add("hidden");
      document.getElementById("secLogin").classList.remove("hidden");
    }

    // Auto Refresh setiap pergantian hari
    function checkAutoRefresh() {
      let lastDate = new Date().getDate();
      setInterval(() => {
        let currentDate = new Date().getDate();
        if (currentDate !== lastDate) {
          location.reload();
        }
      }, 60000);
    }
  </script>
</body>
</html>
