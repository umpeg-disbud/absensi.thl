<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  <!-- Bootstrap 5 CSS & FontAwesome Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 75px; }
    .card-custom { border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; height: 65px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e0e0e0; z-index: 1000; }
    .nav-item-btn { border: none; background: none; color: #6c757d; font-size: 12px; display: flex; flex-direction: column; align-items: center; text-decoration: none; }
    .nav-item-btn.active { color: #0d6efd; font-weight: bold; }
    .fingerprint-btn { background: #0d6efd; color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-top: -30px; box-shadow: 0 4px 10px rgba(13, 110, 253, 0.4); border: 4px solid #ffffff; }
    #map { height: 180px; width: 100%; border-radius: 12px; }
    #webcam { width: 100%; max-width: 320px; border-radius: 12px; border: 2px solid #0d6efd; transform: scaleX(-1); }
  </style>
</head>
<body>

  <div id="app" class="container py-3">
    <!-- VIEW: LOGIN -->
    <div id="view-login" class="row justify-content-center mt-5">
      <div class="col-12 col-md-5">
        <div class="card card-custom p-4">
          <h4 class="text-center fw-bold mb-4 text-primary"><i class="fa-solid fa-user-check me-2"></i>Absensi Online</h4>
          <form id="form-login">
            <div class="mb-3">
              <label class="form-label">NIK (16 Digit)</label>
              <input type="text" id="login-nik" class="form-control" maxlength="16" placeholder="Masukkan NIK" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input type="password" id="login-password" class="form-control" placeholder="Masukkan Password" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('login-password', 'eye-icon')">
                  <i class="fa-solid fa-eye" id="eye-icon"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 mt-2"><i class="fa-solid fa-right-to-bracket me-2"></i>Masuk</button>
          </form>
        </div>
      </div>
    </div>

    <!-- VIEW: MAIN DASHBOARD -->
    <div id="view-dashboard" class="d-none">
      <!-- Info Header -->
      <div class="card card-custom p-3 mb-3 bg-primary text-white">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-0 fw-bold" id="user-nama">-</h5>
            <small id="user-unit">-</small>
          </div>
          <div class="text-end">
            <span class="badge bg-light text-dark" id="server-date">--:--:----</span>
            <div class="h4 mb-0 fw-bold" id="server-time">--:-- WIB</div>
          </div>
        </div>
      </div>

      <!-- Jam Masuk & Pulang Card -->
      <div class="row g-2 mb-3">
        <div class="col-6">
          <div class="card card-custom p-3 text-center bg-white">
            <small class="text-muted"><i class="fa-solid fa-clock text-success me-1"></i>Jam Masuk</small>
            <h4 class="fw-bold mt-1 text-success" id="dash-masuk">--:--</h4>
          </div>
        </div>
        <div class="col-6">
          <div class="card card-custom p-3 text-center bg-white">
            <small class="text-muted"><i class="fa-solid fa-clock text-danger me-1"></i>Jam Pulang</small>
            <h4 class="fw-bold mt-1 text-danger" id="dash-pulang">--:--</h4>
          </div>
        </div>
      </div>

      <!-- Map Card -->
      <div class="card card-custom p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <small class="fw-bold"><i class="fa-solid fa-location-dot text-danger me-1"></i> Titik Lokasi Anda (GPS)</small>
          <small id="gps-status" class="text-muted">Mencari lokasi...</small>
        </div>
        <div id="map"></div>
      </div>
    </div>

    <!-- VIEW: REKAP PRESENSI -->
    <div id="view-rekap" class="d-none">
      <h5 class="fw-bold mb-3"><i class="fa-solid fa-calendar-days me-2"></i>Rekap Presensi</h5>
      <div class="card card-custom p-3 mb-3">
        <button class="btn btn-outline-primary btn-sm w-100" onclick="loadRekap()"><i class="fa-solid fa-rotate me-2"></i>Muat Ulang Data</button>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-striped bg-white">
          <thead class="table-primary">
            <tr>
              <th>Tanggal</th>
              <th>Masuk</th>
              <th>Pulang</th>
            </tr>
          </thead>
          <tbody id="rekap-body">
            <tr><td colspan="3" class="text-center">Belum ada data</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- VIEW: SETTING / EDIT PROFIL -->
    <div id="view-setting" class="d-none">
      <h5 class="fw-bold mb-3"><i class="fa-solid fa-gear me-2"></i>Pengaturan</h5>
      <div class="card card-custom p-3 mb-3">
        <h6>Edit Profil</h6>
        <form id="form-edit-profil">
          <div class="mb-2">
            <label class="form-label small">Nama Lengkap</label>
            <input type="text" id="edit-nama" class="form-control form-control-sm" required>
          </div>
          <div class="mb-2">
            <label class="form-label small">Unit Kerja</label>
            <input type="text" id="edit-unit" class="form-control form-control-sm" required>
          </div>
          <button type="submit" class="btn btn-sm btn-primary mt-2">Simpan Profil</button>
        </form>
      </div>

      <div class="card card-custom p-3">
        <h6>Ubah Password</h6>
        <form id="form-edit-pass">
          <div class="mb-2">
            <label class="form-label small">Password Lama</label>
            <input type="password" id="pass-lama" class="form-control form-control-sm" required>
          </div>
          <div class="mb-2">
            <label class="form-label small">Password Baru</label>
            <div class="input-group">
              <input type="password" id="pass-baru" class="form-control form-control-sm" required>
              <button class="btn btn-outline-secondary btn-sm" type="button" onclick="togglePassword('pass-baru', 'eye-pass-baru')">
                <i class="fa-solid fa-eye" id="eye-pass-baru"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-sm btn-warning mt-2">Update Password</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL ABSENSI & SELFIE CAMERA -->
  <div class="modal fade" id="modalAbsen" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content card-custom">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-camera me-2"></i>Selfie Absensi Wajah</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <video id="webcam" autoplay playsinline></video>
          <canvas id="canvas" class="d-none"></canvas>
          <div class="d-flex justify-content-center gap-2 mt-3">
            <button class="btn btn-success flex-fill py-2" onclick="executeAbsen('masuk')">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Jam Masuk
            </button>
            <button class="btn btn-danger flex-fill py-2" onclick="executeAbsen('pulang')">
              <i class="fa-solid fa-right-from-bracket me-1"></i> Jam Pulang
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav d-none" id="main-nav">
    <button class="nav-item-btn active" onclick="switchTab('dashboard', this)">
      <i class="fa-solid fa-house fs-5"></i>
      <span>Beranda</span>
    </button>
    <button class="nav-item-btn" onclick="switchTab('rekap', this)">
      <i class="fa-solid fa-clipboard-list fs-5"></i>
      <span>Rekap</span>
    </button>
    <button class="nav-item-btn" onclick="openAbsenModal()">
      <div class="fingerprint-btn">
        <i class="fa-solid fa-fingerprint fs-3"></i>
      </div>
      <span style="margin-top: 22px;">Absen</span>
    </button>
    <button class="nav-item-btn" onclick="switchTab('setting', this)">
      <i class="fa-solid fa-user-gear fs-5"></i>
      <span>Setting</span>
    </button>
    <button class="nav-item-btn text-danger" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket fs-5"></i>
      <span>Keluar</span>
    </button>
  </nav>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // MASUKKAN WEB APP URL GOOGLE APPS SCRIPT ANDA DI SINI
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";

    let currentUser = null;
    let currentLat = null;
    let currentLng = null;
    let map = null;
    let marker = null;
    let videoStream = null;

    // Toggle Password Visibility
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Auto Refresh Saat Berganti Hari
    let lastDate = "";
    function checkDateChange(newDate) {
      if (lastDate !== "" && lastDate !== newDate) {
        location.reload();
      }
      lastDate = newDate;
    }

    // Fetch API Helper (Menghilangkan Pop-up Alert bawaan browser)
    async function apiRequest(payload) {
      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (err) {
        console.error("API Error:", err);
        return { success: false, message: "Gagal terhubung ke server Google." };
      }
    }

    // Login Handler
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nik = document.getElementById('login-nik').value;
      const password = document.getElementById('login-password').value;

      const res = await apiRequest({ action: 'login', nik, password });
      if (res.success) {
        currentUser = res.user;
        localStorage.setItem('user_absensi', JSON.stringify(currentUser));
        initApp();
      } else {
        alert(res.message);
      }
    });

    // Logout
    function logout() {
      localStorage.removeItem('user_absensi');
      location.reload();
    }

    // Inisialisasi Aplikasi setelah Login
    function initApp() {
      document.getElementById('view-login').classList.add('d-none');
      document.getElementById('view-dashboard').classList.remove('d-none');
      document.getElementById('main-nav').classList.remove('d-none');

      document.getElementById('user-nama').innerText = currentUser.nama;
      document.getElementById('user-unit').innerText = currentUser.unitKerja;
      document.getElementById('edit-nama').value = currentUser.nama;
      document.getElementById('edit-unit').value = currentUser.unitKerja;

      initGPS();
      loadDashboard();
      setInterval(loadDashboard, 30000); // Sync waktu server per 30 detik
    }

    // Tampilkan Peta Leaflet & GPS Otomatis
    function initGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition((pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          document.getElementById('gps-status').innerText = `${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;

          if (!map) {
            map = L.map('map').setView([currentLat, currentLng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([currentLat, currentLng]).addTo(map).bindPopup("Lokasi Saya").openPopup();
          } else {
            marker.setLatLng([currentLat, currentLng]);
          }
        }, (err) => {
          document.getElementById('gps-status').innerText = "GPS Matikan / Tidak Diijinkan";
        }, { enableHighAccuracy: true });
      }
    }

    // Dashboard Refresh
    async function loadDashboard() {
      if (!currentUser) return;
      const res = await apiRequest({ action: 'getDashboardData', nik: currentUser.nik });
      if (res.success) {
        document.getElementById('server-time').innerText = res.serverTime + " WIB";
        document.getElementById('server-date').innerText = res.serverDate;
        document.getElementById('dash-masuk').innerText = res.jamMasuk;
        document.getElementById('dash-pulang').innerText = res.jamPulang;
        checkDateChange(res.serverDate);
      }
    }

    // Tab Navigation
    function switchTab(tab, element) {
      document.querySelectorAll('.bottom-nav .nav-item-btn').forEach(btn => btn.classList.remove('active'));
      if(element) element.classList.add('active');

      document.getElementById('view-dashboard').classList.add('d-none');
      document.getElementById('view-rekap').classList.add('d-none');
      document.getElementById('view-setting').classList.add('d-none');

      document.getElementById(`view-${tab}`).classList.remove('d-none');
      if (tab === 'rekap') loadRekap();
    }

    // Kamera Selfie
    const modalAbsen = new bootstrap.Modal(document.getElementById('modalAbsen'));
    function openAbsenModal() {
      modalAbsen.show();
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          videoStream = stream;
          document.getElementById('webcam').srcObject = stream;
        })
        .catch(err => alert("Kamera tidak dapat diakses!"));
    }

    document.getElementById('modalAbsen').addEventListener('hidden.bs.modal', () => {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
    });

    // One-Click Absen Handler
    async function executeAbsen(type) {
      if (!currentLat || !currentLng) {
        alert("GPS belum terdeteksi. Izinkan akses GPS terlebih dahulu!");
        return;
      }

      const res = await apiRequest({
        action: 'processAbsen',
        nik: currentUser.nik,
        type: type,
        userLat: currentLat,
        userLng: currentLng
      });

      alert(res.message);
      if (res.success) {
        modalAbsen.hide();
        loadDashboard();
      }
    }

    // Load Rekap
    async function loadRekap() {
      const res = await apiRequest({ action: 'getRekap', nik: currentUser.nik });
      const tbody = document.getElementById('rekap-body');
      tbody.innerHTML = "";
      if (res.success && res.data.length > 0) {
        res.data.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.tanggal}</td>
              <td class="text-success font-weight-bold">${item.jamMasuk}</td>
              <td class="text-danger font-weight-bold">${item.jamPulang}</td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = `<tr><td colspan="3" class="text-center">Belum ada catatan presensi.</td></tr>`;
      }
    }

    // Edit Profil Form
    document.getElementById('form-edit-profil').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('edit-nama').value;
      const unitKerja = document.getElementById('edit-unit').value;

      const res = await apiRequest({ action: 'updateProfile', nik: currentUser.nik, nama, unitKerja });
      alert(res.message);
      if (res.success) {
        currentUser.nama = nama;
        currentUser.unitKerja = unitKerja;
        localStorage.setItem('user_absensi', JSON.stringify(currentUser));
        initApp();
      }
    });

    // Ubah Password Form
    document.getElementById('form-edit-pass').addEventListener('submit', async (e) => {
      e.preventDefault();
      const oldPassword = document.getElementById('pass-lama').value;
      const newPassword = document.getElementById('pass-baru').value;

      const res = await apiRequest({ action: 'updatePassword', nik: currentUser.nik, oldPassword, newPassword });
      alert(res.message);
      if (res.success) {
        document.getElementById('form-edit-pass').reset();
      }
    });

    // Auto Login Session
    window.onload = () => {
      const savedUser = localStorage.getItem('user_absensi');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        initApp();
      }
    };
  </script>
</body>
</html>
