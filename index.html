<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS for OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; }
    #map { height: 180px; width: 100%; border-radius: 12px; }
    .nav-btn.active { color: #2563eb; font-weight: bold; }
    #webcam { transform: scaleX(-1); border-radius: 12px; width: 100%; height: auto; }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between pb-16">

  <!-- APP HEADER -->
  <header class="bg-blue-600 text-white p-4 text-center font-bold text-lg shadow-md flex justify-between items-center">
    <span><i class="fa-solid me-2"></i>E-Absensi Selfie</span>
    <span id="headerClock" class="text-xs bg-blue-700 px-2 py-1 rounded">00:00:00 WIB</span>
  </header>

  <!-- CONTAINER UTAMA -->
  <main class="p-4 max-w-md mx-auto w-full flex-1">

    <!-- 1. HALAMAN LOGIN -->
    <div id="loginPage" class="bg-white p-6 rounded-2xl shadow-lg space-y-4">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Masuk Akun</h2>
      <div>
        <label class="block text-sm font-medium text-gray-700">NIK (16 Digit)</label>
        <input type="number" id="loginNik" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan NIK">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <div class="relative">
          <input type="password" id="loginPass" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan Password">
          <button type="button" onclick="togglePass('loginPass', 'eyeIcon1')" class="absolute right-3 top-4 text-gray-500">
            <i id="eyeIcon1" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>
      <button onclick="doLogin()" id="btnLogin" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">
        LOG IN
      </button>
    </div>

    <!-- 2. HALAMAN HOME (UTAMA) -->
    <div id="homePage" class="hidden space-y-4">
      <!-- Profile Card -->
      <div class="bg-white p-4 rounded-2xl shadow space-y-1">
        <div class="flex justify-between items-center">
          <h3 id="userName" class="font-bold text-gray-800 text-lg">-</h3>
          <span id="userUnit" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full font-semibold">-</span>
        </div>
        <p class="text-xs text-gray-500">NIK: <span id="userNik">-</span></p>
      </div>

      <!-- Live Date & Clock Card -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-5 rounded-2xl shadow text-center space-y-1">
        <p id="liveDate" class="text-sm tracking-wide opacity-90">00-00-0000</p>
        <h1 id="liveClock" class="text-4xl font-extrabold">00:00:00</h1>
        <p class="text-xs opacity-75">Waktu Server (Asia/Jakarta)</p>
      </div>

      <!-- Attendance Info Grid -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-green-50 p-4 border border-green-200 rounded-2xl text-center">
          <p class="text-xs text-green-700 font-semibold mb-1">JAM MASUK</p>
          <p id="jamMasukText" class="text-xl font-bold text-green-800">--:--:--</p>
        </div>
        <div class="bg-red-50 p-4 border border-red-200 rounded-2xl text-center">
          <p class="text-xs text-red-700 font-semibold mb-1">JAM PULANG</p>
          <p id="jamPulangText" class="text-xl font-bold text-red-800">--:--:--</p>
        </div>
      </div>

      <!-- Map & GPS Coordinates -->
      <div class="bg-white p-3 rounded-2xl shadow space-y-2">
        <div class="flex justify-between items-center text-xs text-gray-600">
          <span><i class="fa-solid fa-location-dot text-red-500 me-1"></i> Peta GPS</span>
          <span id="geoCoords" class="font-mono text-gray-500">Mencari Lokasi...</span>
        </div>
        <div id="map"></div>
        <p id="distanceStatus" class="text-xs text-center font-semibold text-gray-600"></p>
      </div>
    </div>

    <!-- 3. SUB-MENU ABSEN (CAMERA & FACE RECOGNITION) -->
    <div id="absenPage" class="hidden bg-white p-4 rounded-2xl shadow space-y-4">
      <h3 class="text-center font-bold text-gray-800">Ambil Foto Selfie Wajah</h3>
      
      <div class="relative bg-black rounded-2xl overflow-hidden">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas" class="hidden"></canvas>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="processAbsen('masuk')" class="bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 shadow">
          <i class="fa-solid fa-right-to-bracket me-1"></i> Absen Masuk
        </button>
        <button onclick="processAbsen('pulang')" class="bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 shadow">
          <i class="fa-solid fa-right-from-bracket me-1"></i> Absen Pulang
        </button>
      </div>
    </div>

    <!-- 4. HALAMAN REKAP PRESENSI -->
    <div id="rekapPage" class="hidden bg-white p-4 rounded-2xl shadow space-y-4">
      <h3 class="font-bold text-gray-800">Rekap Presensi Saya</h3>
      <div class="flex gap-2">
        <input type="date" id="filterDate" class="border p-2 rounded-xl text-sm flex-1">
        <button onclick="loadRekap()" class="bg-blue-600 text-white px-4 rounded-xl font-semibold text-sm">Filter</button>
        <button onclick="resetRekap()" class="bg-gray-200 text-gray-700 px-3 rounded-xl text-sm">Reset</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-gray-100 border-b">
              <th class="p-2">Tanggal</th>
              <th class="p-2">Masuk</th>
              <th class="p-2">Pulang</th>
            </tr>
          </thead>
          <tbody id="rekapTableBody">
            <!-- Data Rekap -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 5. HALAMAN SETTING (EDIT PASSWORD) -->
    <div id="settingPage" class="hidden bg-white p-6 rounded-2xl shadow space-y-4">
      <h3 class="font-bold text-gray-800 text-lg">Pengaturan Akun</h3>
      <div>
        <label class="block text-sm text-gray-700">Password Baru</label>
        <div class="relative">
          <input type="password" id="newPass" class="w-full mt-1 p-3 border rounded-xl outline-none" placeholder="Masukkan password baru">
          <button type="button" onclick="togglePass('newPass', 'eyeIcon2')" class="absolute right-3 top-4 text-gray-500">
            <i id="eyeIcon2" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>
      <button onclick="saveNewPassword()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Simpan Password</button>
    </div>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 shadow-lg max-w-md mx-auto z-50">
    <button onclick="switchTab('home')" id="navHome" class="nav-btn active flex flex-col items-center text-xs text-gray-500">
      <i class="fa-solid fa-house text-lg"></i> Home
    </button>
    <button onclick="switchTab('rekap')" id="navRekap" class="nav-btn flex flex-col items-center text-xs text-gray-500">
      <i class="fa-solid fa-calendar-check text-lg"></i> Rekap
    </button>
    <button onclick="switchTab('absen')" id="navAbsen" class="nav-btn flex flex-col items-center text-xs text-gray-500">
      <div class="bg-blue-600 text-white p-3 rounded-full -mt-5 shadow-lg border-2 border-white">
        <i class="fa-solid fa-fingerprint text-xl"></i>
      </div>
      Absen
    </button>
    <button onclick="switchTab('setting')" id="navSetting" class="nav-btn flex flex-col items-center text-xs text-gray-500">
      <i class="fa-solid fa-gear text-lg"></i> Setting
    </button>
    <button onclick="doLogout()" class="nav-btn flex flex-col items-center text-xs text-red-500">
      <i class="fa-solid fa-right-from-bracket text-lg"></i> Keluar
    </button>
  </nav>

  <!-- SCRIPT LOGIC -->
  <script>
    // MASUKKAN URL WEB APP APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";

    let currentUser = null;
    let currentLat = null;
    let currentLng = null;
    let map = null, marker = null, circle = null;
    let videoStream = null;
    let currentServerDate = "";

    // Toggle Sembunyikan/Tampilkan Password
    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Panggil API Backend
    async function apiCall(payload) {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    // Login Function
    async function doLogin() {
      const nik = document.getElementById("loginNik").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      if (!nik || !pass) return alert("NIK dan Password wajib diisi!");

      document.getElementById("btnLogin").innerText = "Memproses...";
      try {
        const res = await apiCall({ action: "login", nik: nik, password: pass });
        document.getElementById("btnLogin").innerText = "LOG IN";

        if (res.success) {
          currentUser = res.user;
          localStorage.setItem("user_absensi", JSON.stringify(currentUser));
          initApp();
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert("Gagal koneksi ke server");
        document.getElementById("btnLogin").innerText = "LOG IN";
      }
    }

    // Inisialisasi Aplikasi Setelah Login
    function initApp() {
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("homePage").classList.remove("hidden");
      document.getElementById("bottomNav").classList.remove("hidden");

      document.getElementById("userName").innerText = currentUser.nama;
      document.getElementById("userNik").innerText = currentUser.nik;
      document.getElementById("userUnit").innerText = currentUser.unitKerja;

      initGPS();
      loadTodayStatus();
      startServerClock();
    }

    // GPS Auto Tracking & Leaflet Map Setup
    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById("geoCoords").innerText = `${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;
            updateMap();
          },
          (err) => {
            alert("Harap aktifkan GPS / Izin Lokasi di HP Anda.");
          },
          { enableHighAccuracy: true }
        );
      }
    }

    function updateMap() {
      if (!currentLat || !currentLng) return;

      if (!map) {
        map = L.map('map').setView([currentLat, currentLng], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.marker([currentLat, currentLng]).addTo(map);
      } else {
        marker.setLatLng([currentLat, currentLng]);
        map.panTo([currentLat, currentLng]);
      }

      // Hitung Jarak dari Titik Target (Unit Kerja)
      const dist = calculateDistance(currentLat, currentLng, currentUser.targetLat, currentUser.targetLng);
      const distElem = document.getElementById("distanceStatus");
      if (dist <= 50) {
        distElem.innerHTML = `<span class="text-green-600"><i class="fa-solid fa-circle-check"></i> Dalam Radius (${Math.round(dist)} m)</span>`;
      } else {
        distElem.innerHTML = `<span class="text-red-600"><i class="fa-solid fa-circle-xmark"></i> Diluar Radius (${Math.round(dist)} m dari kantor)</span>`;
      }
    }

    // Rumus Haversine Hitung Jarak Meter
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // meter
      const φ1 = lat1 * Math.PI/180;
      const φ2 = lat2 * Math.PI/180;
      const Δφ = (lat2-lat1) * Math.PI/180;
      const Δλ = (lon2-lon1) * Math.PI/180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Jam Server & Refresh Otomatis Saat Ganti Hari
    function startServerClock() {
      setInterval(async () => {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('id-ID', { hour12: false, timeZone: 'Asia/Jakarta' });
        document.getElementById("liveClock").innerText = timeStr;
        document.getElementById("headerClock").innerText = timeStr + " WIB";
      }, 1000);

      // Cek Status Absen Hari Ini
      setInterval(checkDateRefresh, 60000); // Tiap 1 menit
    }

    async function checkDateRefresh() {
      const res = await apiCall({ action: "getServerTime" });
      if (res.success) {
        if (currentServerDate && currentServerDate !== res.serverDate) {
          // Tanggal berganti -> Refresh Status
          loadTodayStatus();
        }
        currentServerDate = res.serverDate;
        document.getElementById("liveDate").innerText = res.serverDate;
      }
    }

    async function loadTodayStatus() {
      const res = await apiCall({ action: "getTodayStatus", nik: currentUser.nik });
      if (res.success) {
        document.getElementById("jamMasukText").innerText = res.jamMasuk;
        document.getElementById("jamPulangText").innerText = res.jamPulang;
        document.getElementById("liveDate").innerText = res.todayDate;
        currentServerDate = res.todayDate;
      }
    }

    // Switch Tab Halaman
    function switchTab(tab) {
      document.querySelectorAll("main > div").forEach(el => el.classList.add("hidden"));
      document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));

      stopCamera();

      if (tab === 'home') {
        document.getElementById("homePage").classList.remove("hidden");
        document.getElementById("navHome").classList.add("active");
        setTimeout(() => { if (map) map.invalidateSize(); }, 200);
      } else if (tab === 'absen') {
        document.getElementById("absenPage").classList.remove("hidden");
        document.getElementById("navAbsen").classList.add("active");
        startCamera();
      } else if (tab === 'rekap') {
        document.getElementById("rekapPage").classList.remove("hidden");
        document.getElementById("navRekap").classList.add("active");
        loadRekap();
      } else if (tab === 'setting') {
        document.getElementById("settingPage").classList.remove("hidden");
        document.getElementById("navSetting").classList.add("active");
      }
    }

    // Kamera Selfie untuk Absen
    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById("webcam").srcObject = videoStream;
      } catch (err) {
        alert("Gagal mengakses kamera depan: " + err.message);
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    // Process Absen
    async function processAbsen(type) {
      if (!currentLat || !currentLng) return alert("Lokasi GPS belum terkunci.");

      // Cek Jarak Radius 50 Meter
      const dist = calculateDistance(currentLat, currentLng, currentUser.targetLat, currentUser.targetLng);
      if (dist > 50) {
        return alert(`Gagal Absen! Anda berada ${Math.round(dist)} meter dari kantor (Batas Maksimal 50 meter).`);
      }

      // Ambil snapshot selfie dari webcam
      const video = document.getElementById("webcam");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      if (!confirm(`Konfirmasi untuk Absen ${type.toUpperCase()}?`)) return;

      const payload = {
        action: "submitAbsen",
        nik: currentUser.nik,
        nama: currentUser.nama,
        unitKerja: currentUser.unitKerja,
        type: type,
        lat: currentLat,
        lng: currentLng
      };

      const res = await apiCall(payload);
      if (res.success) {
        alert(res.message);
        if (type === 'masuk') document.getElementById("jamMasukText").innerText = res.jamMasuk;
        if (type === 'pulang') document.getElementById("jamPulangText").innerText = res.jamPulang;
        switchTab('home');
      } else {
        alert(res.message);
      }
    }

    // Rekap Presensi
    async function loadRekap() {
      const filterDateVal = document.getElementById("filterDate").value;
      let formattedFilter = "";
      if (filterDateVal) {
        const parts = filterDateVal.split("-");
        formattedFilter = `${parts[2]}-${parts[1]}-${parts[0]}`; // Convert yyyy-mm-dd to dd-MM-yyyy
      }

      const res = await apiCall({ action: "getRekap", nik: currentUser.nik, date: formattedFilter });
      const tbody = document.getElementById("rekapTableBody");
      tbody.innerHTML = "";

      if (res.success && res.data.length > 0) {
        res.data.forEach(row => {
          tbody.innerHTML += `
            <tr class="border-b">
              <td class="p-2 font-medium">${row.tanggal}</td>
              <td class="p-2 text-green-600 font-bold">${row.jamMasuk}</td>
              <td class="p-2 text-red-600 font-bold">${row.jamPulang}</td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = `<tr><td colspan="3" class="p-3 text-center text-gray-400">Tidak ada data presensi</td></tr>`;
      }
    }

    function resetRekap() {
      document.getElementById("filterDate").value = "";
      loadRekap();
    }

    // Edit Password
    async function saveNewPassword() {
      const newPass = document.getElementById("newPass").value.trim();
      if (!newPass) return alert("Password baru wajib diisi!");

      const res = await apiCall({ action: "updatePassword", nik: currentUser.nik, newPassword: newPass });
      if (res.success) {
        alert(res.message);
        document.getElementById("newPass").value = "";
      } else {
        alert(res.message);
      }
    }

    // Logout
    function doLogout() {
      if (confirm("Apakah Anda yakin ingin keluar?")) {
        localStorage.removeItem("user_absensi");
        currentUser = null;
        stopCamera();
        document.getElementById("homePage").classList.add("hidden");
        document.getElementById("bottomNav").classList.add("hidden");
        document.getElementById("loginPage").classList.remove("hidden");
      }
    }

    // Auto Login
    window.onload = () => {
      const savedUser = localStorage.getItem("user_absensi");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        initApp();
      }
    };
  </script>
</body>
</html>
