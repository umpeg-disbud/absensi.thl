<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS & JS untuk Peta -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 180px; width: 100%; border-radius: 12px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; z-index: 1000; }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800 pb-20">

  <!-- URL Back-End Apps Script -->
  <script>
    // GANTI SCRIPT_URL DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";
  </script>

  <!-- APPLIKASI CONTAINER -->
  <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col relative">

    <!-- HEADER / ALERT custom (Pengganti Pop-up "An embedded page at") -->
    <div id="alertBox" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm p-4 rounded-lg shadow-lg text-white text-sm text-center transition-all"></div>

    <!-- PAGE LOGIN -->
    <div id="pageLogin" class="p-6 flex flex-col justify-center flex-grow">
      <div class="text-center mb-8">
        <i class="fa-solid fa-user-check text-5xl text-blue-600 mb-2"></i>
        <h2 class="text-2xl font-bold text-gray-800">Presensi Online</h2>
        <p class="text-xs text-gray-500">Silakan login dengan NIK & Password</p>
      </div>

      <form id="formLogin" onsubmit="doLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">NIK (16 Angka)</label>
          <input type="text" id="loginNik" maxlength="16" pattern="\d{16}" required placeholder="Masukkan 16 digit NIK" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="loginPassword" required placeholder="Masukkan Password" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm pr-10">
            <button type="button" onclick="togglePassVisibility('loginPassword', 'eyeIconLogin')" class="absolute right-3 top-3 text-gray-500">
              <i id="eyeIconLogin" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg text-sm shadow">
          Masuk
        </button>
      </form>
    </div>

    <!-- MAIN APP CONTENT (TAMPIL SETELAH LOGIN) -->
    <div id="mainContent" class="hidden flex-grow flex flex-col">

      <!-- PAGE HOME -->
      <div id="pageHome" class="p-4 space-y-4">
        <!-- User Info Card -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl p-4 text-white shadow">
          <p class="text-xs opacity-80">Selamat Datang,</p>
          <h3 id="userNama" class="text-lg font-bold">-[Nama]-</h3>
          <p id="userUnit" class="text-xs mt-1 bg-white/20 inline-block px-2 py-0.5 rounded">-[Unit Kerja]-</p>
        </div>

        <!-- Time & Date Card -->
        <div class="bg-gray-50 border rounded-xl p-4 text-center shadow-sm">
          <p id="clockDate" class="text-xs font-semibold text-gray-500">-- : -- : ----</p>
          <h1 id="clockTime" class="text-4xl font-extrabold text-blue-700 my-1">00:00:00</h1>
          <p class="text-[10px] text-gray-400">WIB (Asia/Jakarta)</p>
        </div>

        <!-- Jam Masuk & Pulang Grid -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-green-50 border border-green-200 p-3 rounded-xl text-center">
            <i class="fa-solid fa-right-to-bracket text-green-600 mb-1"></i>
            <p class="text-[11px] text-gray-500">Jam Masuk</p>
            <p id="displayJamMasuk" class="text-base font-bold text-green-700">--:--:--</p>
          </div>
          <div class="bg-red-50 border border-red-200 p-3 rounded-xl text-center">
            <i class="fa-solid fa-right-from-bracket text-red-600 mb-1"></i>
            <p class="text-[11px] text-gray-500">Jam Pulang</p>
            <p id="displayJamPulang" class="text-base font-bold text-red-700">--:--:--</p>
          </div>
        </div>

        <!-- Peta GPS -->
        <div class="space-y-1">
          <p class="text-xs font-semibold text-gray-600"><i class="fa-solid fa-location-dot text-red-500"></i> Lokasi GPS Anda</p>
          <div id="map"></div>
          <p id="geoStatus" class="text-[10px] text-gray-500 text-center">Mendapatkan koordinat GPS...</p>
        </div>
      </div>

      <!-- PAGE REKAP -->
      <div id="pageRekap" class="hidden p-4 space-y-3">
        <h3 class="font-bold text-gray-700 text-sm">Rekap Presensi Anda</h3>
        <div id="rekapList" class="space-y-2 max-h-[70vh] overflow-y-auto">
          <!-- Item rekap di-generate oleh JS -->
        </div>
      </div>

      <!-- PAGE SETTING -->
      <div id="pageSetting" class="hidden p-4 space-y-4">
        <h3 class="font-bold text-gray-700 text-sm">Ubah Password</h3>
        <form onsubmit="doChangePassword(event)" class="space-y-3">
          <div>
            <label class="block text-xs text-gray-600 mb-1">Password Lama</label>
            <div class="relative">
              <input type="password" id="oldPass" required class="w-full px-3 py-2 border rounded-lg text-sm pr-10">
              <button type="button" onclick="togglePassVisibility('oldPass', 'eyeOld')" class="absolute right-3 top-2.5 text-gray-500"><i id="eyeOld" class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div>
            <label class="block text-xs text-gray-600 mb-1">Password Baru</label>
            <div class="relative">
              <input type="password" id="newPass" required class="w-full px-3 py-2 border rounded-lg text-sm pr-10">
              <button type="button" onclick="togglePassVisibility('newPass', 'eyeNew')" class="absolute right-3 top-2.5 text-gray-500"><i id="eyeNew" class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white text-sm py-2 rounded-lg font-semibold">Simpan Password</button>
        </form>
      </div>

    </div>

    <!-- MODAL KAMERA (SUB-MENU SIDIK JARI / ABSEN) -->
    <div id="modalAbsen" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl p-4 w-full max-w-sm space-y-3 text-center relative">
        <button onclick="closeCameraModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
        <h3 class="font-bold text-gray-800 text-sm">Selfie Wajah Absensi</h3>
        
        <div class="relative bg-black rounded-lg overflow-hidden h-64 flex items-center justify-center">
          <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
          <canvas id="canvas" class="hidden"></canvas>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="processAbsen('absensimasuk')" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-3 rounded-lg flex items-center justify-center gap-1">
            <i class="fa-solid fa-right-to-bracket"></i> Oneclick Jam Masuk
          </button>
          <button onclick="processAbsen('absensipulang')" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-3 rounded-lg flex items-center justify-center gap-1">
            <i class="fa-solid fa-right-from-bracket"></i> Oneclick Jam Pulang
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION MENU -->
    <div id="bottomNav" class="hidden bottom-nav border-t flex justify-around items-center py-2 text-gray-500 max-w-md mx-auto">
      <button onclick="switchTab('home')" id="navHome" class="flex flex-col items-center text-blue-600">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] mt-0.5">Home</span>
      </button>
      <button onclick="switchTab('rekap')" id="navRekap" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-list-check text-lg"></i>
        <span class="text-[10px] mt-0.5">Rekap</span>
      </button>
      <!-- Tombol Sidik Jari Absen -->
      <button onclick="openCameraModal()" class="flex flex-col items-center -mt-5 bg-blue-600 text-white p-3 rounded-full shadow-lg hover:bg-blue-700">
        <i class="fa-solid fa-fingerprint text-2xl"></i>
      </button>
      <button onclick="switchTab('setting')" id="navSetting" class="flex flex-col items-center hover:text-blue-600">
        <i class="fa-solid fa-gear text-lg"></i>
        <span class="text-[10px] mt-0.5">Setting</span>
      </button>
      <button onclick="doLogout()" class="flex flex-col items-center hover:text-red-600">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
        <span class="text-[10px] mt-0.5">Keluar</span>
      </button>
    </div>

  </div>

  <!-- SCRIPT LOGIC FRONT-END -->
  <script>
    let currentUser = null;
    let currentLat = null;
    let currentLng = null;
    let map = null;
    let marker = null;
    let videoStream = null;
    let currentDateString = "";

    // Notifications (Custom Alert tanpa pop-up bawaan browser)
    function showAlert(msg, isSuccess = true) {
      const box = document.getElementById("alertBox");
      box.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm p-3 rounded-lg shadow-lg text-white text-xs text-center transition-all ${isSuccess ? 'bg-green-600' : 'bg-red-600'}`;
      box.innerText = msg;
      box.classList.remove("hidden");
      setTimeout(() => box.classList.add("hidden"), 3500);
    }

    // Toggle password visibility
    function togglePassVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Geolocation / Auto GPS Activation
    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById("geoStatus").innerText = `Koordinat: ${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`;
            updateMap(currentLat, currentLng);
          },
          (err) => {
            document.getElementById("geoStatus").innerText = "Gagal mengambil lokasi GPS. Izinkan akses GPS.";
          },
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
        );
      } else {
        document.getElementById("geoStatus").innerText = "Browser tidak mendukung GPS.";
      }
    }

    // Leaflet Map Init
    function updateMap(lat, lng) {
      if (!map) {
        map = L.map('map').setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        marker = L.marker([lat, lng]).addTo(map).bindPopup("Lokasi Anda").openPopup();
      } else {
        marker.setLatLng([lat, lng]);
        map.panTo([lat, lng]);
      }
    }

    // Realtime Server Time Sync & Auto Refresh Date
    function startClock() {
      setInterval(() => {
        const now = new Date();
        const optionsDate = { timeZone: 'Asia/Jakarta', day: '2-digit', month: '2-digit', year: 'numeric' };
        const optionsTime = { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };

        const formattedDate = new Intl.DateTimeFormat('id-ID', optionsDate).format(now).replace(/\//g, '-');
        const formattedTime = new Intl.DateTimeFormat('id-ID', optionsTime).format(now);

        document.getElementById("clockTime").innerText = formattedTime;
        document.getElementById("clockDate").innerText = formattedDate;

        // Auto Refresh jika berganti hari
        if (currentDateString && currentDateString !== formattedDate && currentUser) {
          currentDateString = formattedDate;
          loadTodayStatus();
        }
      }, 1000);
    }

    // API Post Request Helper
    async function apiPost(payload) {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    // Handle Login
    async function doLogin(e) {
      e.preventDefault();
      const nik = document.getElementById("loginNik").value;
      const pass = document.getElementById("loginPassword").value;
      const btn = document.getElementById("btnLogin");

      btn.disabled = true;
      btn.innerText = "Memproses...";

      try {
        const res = await apiPost({ action: "login", nik: nik, password: pass });
        if (res.success) {
          currentUser = res.user;
          document.getElementById("userNama").innerText = currentUser.nama;
          document.getElementById("userUnit").innerText = currentUser.unitKerja;

          document.getElementById("pageLogin").classList.add("hidden");
          document.getElementById("mainContent").classList.remove("hidden");
          document.getElementById("bottomNav").classList.remove("hidden");

          initGPS();
          loadTodayStatus();
        } else {
          showAlert(res.message, false);
        }
      } catch (err) {
        showAlert("Gagal tersambung ke server.", false);
      } finally {
        btn.disabled = false;
        btn.innerText = "Masuk";
      }
    }

    // Status Absen Hari Ini
    async function loadTodayStatus() {
      if (!currentUser) return;
      try {
        const res = await apiPost({ action: "getTodayStatus", nik: currentUser.nik });
        if (res.success) {
          document.getElementById("displayJamMasuk").innerText = res.jamMasuk;
          document.getElementById("displayJamPulang").innerText = res.jamPulang;
          currentDateString = res.todayDate;
        }
      } catch (e) {}
    }

    // Tab Navigation
    function switchTab(tab) {
      document.getElementById("pageHome").classList.add("hidden");
      document.getElementById("pageRekap").classList.add("hidden");
      document.getElementById("pageSetting").classList.add("hidden");

      document.querySelectorAll("#bottomNav button").forEach(b => b.classList.remove("text-blue-600"));

      if (tab === 'home') {
        document.getElementById("pageHome").classList.remove("hidden");
        document.getElementById("navHome").classList.add("text-blue-600");
      } else if (tab === 'rekap') {
        document.getElementById("pageRekap").classList.remove("hidden");
        document.getElementById("navRekap").classList.add("text-blue-600");
        loadRekap();
      } else if (tab === 'setting') {
        document.getElementById("pageSetting").classList.remove("hidden");
        document.getElementById("navSetting").classList.add("text-blue-600");
      }
    }

    // Open Camera Selfie Modal
    async function openCameraModal() {
      if (!currentLat || !currentLng) {
        showAlert("Sedang mengambil lokasi GPS, mohon tunggu sebentar...", false);
        return;
      }
      document.getElementById("modalAbsen").classList.remove("hidden");
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        document.getElementById("video").srcObject = videoStream;
      } catch (err) {
        showAlert("Gagal mengakses kamera depan.", false);
        closeCameraModal();
      }
    }

    // Close Camera Selfie Modal
    function closeCameraModal() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById("modalAbsen").classList.add("hidden");
    }

    // Process Absen (Oneclick Jam Masuk / Pulang)
    async function processAbsen(actionType) {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d");

      canvas.width = video.videoWidth || 320;
      canvas.height = video.videoHeight || 240;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL("image/jpeg", 0.6);

      closeCameraModal();
      showAlert("Sedang memverifikasi lokasi & mencatat presensi...", true);

      try {
        const res = await apiPost({
          action: actionType,
          nik: currentUser.nik,
          userLat: currentLat,
          userLng: currentLng,
          photo: base64Image
        });

        if (res.success) {
          showAlert(res.message, true);
          loadTodayStatus();
        } else {
          showAlert(res.message, false);
        }
      } catch (err) {
        showAlert("Terjadi kesalahan sistem saat absensi.", false);
      }
    }

    // Load Rekap Presensi
    async function loadRekap() {
      const list = document.getElementById("rekapList");
      list.innerHTML = "<p class='text-xs text-center text-gray-500'>Memuat rekap...</p>";

      try {
        const res = await apiPost({ action: "getRekap", nik: currentUser.nik });
        if (res.success && res.data.length > 0) {
          list.innerHTML = res.data.map(item => `
            <div class="p-3 bg-gray-50 border rounded-lg text-xs flex justify-between items-center">
              <div>
                <p class="font-bold text-gray-700">${item.tanggal}</p>
                <p class="text-[10px] text-gray-500"><i class="fa-solid fa-location-dot"></i> ${item.koordinat}</p>
              </div>
              <div class="text-right">
                <span class="text-green-600 font-bold">M: ${item.jamMasuk}</span> | 
                <span class="text-red-600 font-bold">P: ${item.jamPulang}</span>
              </div>
            </div>
          `).join('');
        } else {
          list.innerHTML = "<p class='text-xs text-center text-gray-500'>Belum ada data presensi.</p>";
        }
      } catch (err) {
        list.innerHTML = "<p class='text-xs text-center text-red-500'>Gagal memuat rekap.</p>";
      }
    }

    // Ubah Password
    async function doChangePassword(e) {
      e.preventDefault();
      const oldPassword = document.getElementById("oldPass").value;
      const newPassword = document.getElementById("newPass").value;

      try {
        const res = await apiPost({
          action: "changePassword",
          nik: currentUser.nik,
          oldPassword: oldPassword,
          newPassword: newPassword
        });

        if (res.success) {
          showAlert(res.message, true);
          document.getElementById("oldPass").value = "";
          document.getElementById("newPass").value = "";
          switchTab('home');
        } else {
          showAlert(res.message, false);
        }
      } catch (err) {
        showAlert("Gagal mengupdate password.", false);
      }
    }

    // Logout
    function doLogout() {
      currentUser = null;
      document.getElementById("loginPassword").value = "";
      document.getElementById("mainContent").classList.add("hidden");
      document.getElementById("bottomNav").classList.add("hidden");
      document.getElementById("pageLogin").classList.remove("hidden");
    }

    // Start jam & tanggal saat halaman dimuat
    startClock();
  </script>
</body>
</html>
