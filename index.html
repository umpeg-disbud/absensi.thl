<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi Online</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- Screen Login -->
  <div id="loginScreen" class="screen active">
    <div class="login-card">
      <i class="fa-solid me-2 fa-user-shield logo-icon"></i>
      <h2>Absensi Online</h2>
      <p>Masukan NIK dan Password Anda</p>
      
      <div class="input-group">
        <i class="fa-solid fa-id-card"></i>
        <input type="text" id="loginNik" maxlength="16" placeholder="NIK (16 Digit Tekstual)">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="loginPass" placeholder="Password">
        <i class="fa-solid fa-eye toggle-password" onclick="togglePass('loginPass', this)"></i>
      </div>

      <button class="btn-primary" onclick="login()">Masuk</button>
    </div>
  </div>

  <!-- Main App Layout -->
  <div id="appScreen" class="screen">
    <!-- Header -->
    <header class="app-header">
      <div>
        <h3 id="userNamaDisplay">Nama User</h3>
        <p id="userUnitDisplay">Unit Kerja</p>
      </div>
      <button class="btn-icon" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </header>

    <!-- Content Sections -->
    <main class="content-area">
      
      <!-- Home Tab -->
      <section id="homeTab" class="tab-content active">
        <div class="time-card">
          <h2 id="clockDisplay">00:00:00</h2>
          <p id="dateDisplay">dd-MM-yyyy</p>
        </div>

        <div class="status-grid">
          <div class="status-box">
            <span>Jam Masuk</span>
            <strong id="jamMasukDisplay">-</strong>
          </div>
          <div class="status-box">
            <span>Jam Pulang</span>
            <strong id="jamPulangDisplay">-</strong>
          </div>
        </div>

        <div class="map-container">
          <div id="map"></div>
        </div>
      </section>

      <!-- Rekap Tab -->
      <section id="rekapTab" class="tab-content">
        <h3>Rekap Absensi</h3>
        <div class="rekap-list" id="rekapList">
          <p>Memuat data rekap...</p>
        </div>
      </section>

      <!-- Profile Tab -->
      <section id="profileTab" class="tab-content">
        <h3>Data Pribadi</h3>
        <div class="profile-card">
          <p><strong>NIK:</strong> <span id="profNik"></span></p>
          <p><strong>Nama:</strong> <span id="profNama"></span></p>
          <p><strong>Unit Kerja:</strong> <span id="profUnit"></span></p>
        </div>
      </section>

      <!-- Settings Tab -->
      <section id="settingsTab" class="tab-content">
        <h3>Edit Data Pribadi</h3>
        <div class="form-group">
          <label>Nama</label>
          <input type="text" id="editNama">
        </div>
        <div class="form-group">
          <label>Unit Kerja</label>
          <input type="text" id="editUnit">
        </div>
        <div class="form-group">
          <label>Password Baru</label>
          <div class="input-group">
            <input type="password" id="editPass">
            <i class="fa-solid fa-eye toggle-password" onclick="togglePass('editPass', this)"></i>
          </div>
        </div>
        <button class="btn-primary" onclick="saveSettings()">Simpan Perubahan</button>
      </section>

    </main>

    <!-- Modal Camera / Face Recognition Selfie -->
    <div id="cameraModal" class="modal">
      <div class="modal-content">
        <h4>Ambil Selfie Wajah</h4>
        <div class="webcam-box">
          <video id="webcam" autoplay playsinline></video>
        </div>
        <div class="modal-actions">
          <button class="btn-success" onclick="executeAbsen('masuk')">OneClick Jam Masuk</button>
          <button class="btn-warning" onclick="executeAbsen('pulang')">OneClick Jam Pulang</button>
          <button class="btn-danger" onclick="closeCamera()">Batal</button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('homeTab', this)">
        <i class="fa-solid fa-house"></i>
        <span>Beranda</span>
      </button>
      <button class="nav-item" onclick="switchTab('rekapTab', this)">
        <i class="fa-solid fa-file-lines"></i>
        <span>Rekap</span>
      </button>
      
      <!-- Fingerprint Center Action Button -->
      <button class="nav-fingerprint" onclick="openCamera()">
        <i class="fa-solid fa-fingerprint"></i>
      </button>

      <button class="nav-item" onclick="switchTab('profileTab', this)">
        <i class="fa-solid fa-user"></i>
        <span>Profil</span>
      </button>
      <button class="nav-item" onclick="switchTab('settingsTab', this)">
        <i class="fa-solid fa-gear"></i>
        <span>Setting</span>
      </button>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
