<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  
  <!-- CSS Framework & Leaflet Maps -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 70px; }
    .card-custom { border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    #map { height: 180px; width: 100%; border-radius: 12px; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e0e0e0; height: 60px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { border: none; background: none; color: #6c757d; display: flex; flex-direction: column; align-items: center; font-size: 11px; text-decoration: none; }
    .nav-item.active { color: #0d6efd; font-weight: bold; }
    .nav-item i { font-size: 20px; }
    .btn-fingerprint { position: relative; top: -15px; background: #0d6efd; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(13,110,253,0.4); border: 3px solid #fff; }
    .btn-fingerprint i { font-size: 26px; }
    .clock-display { font-size: 2.2rem; font-weight: 700; letter-spacing: 1px; color: #0d6efd; }
    #webcam { width: 100%; border-radius: 10px; max-height: 250px; object-fit: cover; }
  </style>
</head>
<body>

  <!-- App Container -->
  <div class="container py-3" id="app">
    
    <!-- LOGIN SCREEN -->
    <div id="login-section" class="row justify-content-center pt-5">
      <div class="col-md-6 col-lg-4">
        <div class="card card-custom p-4">
          <h4 class="text-center font-weight-bold mb-4">Login Absensi</h4>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">NIK (16 Digit)</label>
              <input type="text" id="loginNik" class="form-control" maxlength="16" pattern="\d{16}" placeholder="Masukkan NIK" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group">
                <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan Password" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword', 'eyeIcon')">
                  <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Masuk</button>
          </form>
        </div>
      </div>
    </div>

    <!-- MAIN DASHBOARD PAGE -->
    <div id="dashboard-page" class="page-content d-none">
      <div class="card card-custom p-3 mb-3 text-center bg-primary text-white">
        <h5 id="dashNama" class="mb-0 fw-bold">-</h5>
        <small id="dashUnit">-</small>
      </div>

      <div class="card card-custom p-3 mb-3 text-center">
        <small class="text-muted fw-bold" id="dashTanggal">00-00-0000</small>
        <div class="clock-display my-1" id="dashJam">00:00:00</div>
        <small class="text-muted">Waktu Server Google (WIB)</small>
        
        <div class="row mt-3 border-top pt-2">
          <div class="col-6 border-end">
            <small class="text-muted d-block">Jam Masuk</small>
            <span class="fw-bold text-success fs-5" id="dashMasuk">--:--</span>
          </div>
          <div class="col-6">
            <small class="text-muted d-block">Jam Pulang</small>
            <span class="fw-bold text-danger fs-5" id="dashPulang">--:--</span>
          </div>
        </div>
      </div>

      <div class="card card-custom p-3 mb-3">
        <small class="fw-bold text-muted mb-2 d-block"><i class="bi bi-geo-alt-fill text-danger"></i> Titik Koordinat GPS Saat Ini</small>
        <div id="map"></div>
        <small id="geoStatus" class="text-muted mt-2 text-center" style="font-size:11px;">Mendeteksi Lokasi...</small>
      </div>
    </div>

    <!-- SUB MENU ABSEN (CAMERA SELFIE) -->
    <div id="absen-page" class="page-content d-none">
      <div class="card card-custom p-3 text-center">
        <h5 class="fw-bold mb-3">Absensi Face Recognition Selfie</h5>
        <video id="webcam" autoplay playsinline class="bg-dark mb-3"></video>
        <canvas id="canvas" class="d-none"></canvas>
        
        <div class="d-flex justify-content-center gap-2">
          <button class="btn btn-success w-50 py-2" onclick="processAbsen('masuk')">
            <i class="bi bi-box-arrow-in-right"></i> Oneclick Masuk
          </button>
          <button class="btn btn-danger w-50 py-2" onclick="processAbsen('pulang')">
            <i class="bi bi-box-arrow-left"></i> Oneclick Pulang
          </button>
        </div>
      </div>
    </div>

    <!-- REKAP PRESENSI PAGE -->
    <div id="rekap-page" class="page-content d-none">
      <div class="card card-custom p-3">
        <h5 class="fw-bold mb-3">Rekap Presensi</h5>
        <div class="input-group mb-3">
          <input type="text" id="filterTanggal" class="form-control" placeholder="dd-MM-yyyy">
          <button class="btn btn-outline-primary" onclick="loadRekap()"><i class="bi bi-search"></i> Cari</button>
        </div>
        <div class="table-responsive">
          <table class="table table-striped text-center style-sm">
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Masuk</th>
                <th>Pulang</th>
              </tr>
            </thead>
            <tbody id="rekapTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- SETTING & DATA PRIBADI PAGE -->
    <div id="setting-page" class="page-content d-none">
      <div class="card card-custom p-3 mb-3">
        <h5 class="fw-bold mb-3">Data Pribadi & Pengaturan</h5>
        <form id="settingForm">
          <div class="mb-2">
            <label class="form-label small">NIK</label>
            <input type="text" id="setNik" class="form-control" readonly>
          </div>
          <div class="mb-2">
            <label class="form-label small">Nama Lengkap</label>
            <input type="text" id="setNama" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label small">Unit Kerja</label>
            <input type="text" id="setUnit" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label small">Edit Password</label>
            <div class="input-group">
              <input type="password" id="setPass" class="form-control">
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('setPass', 'eyeIconSet')">
                <i class="bi bi-eye" id="eyeIconSet"></i>
              </button>
            </div>
          </div>
          <button type="button" class="btn btn-primary w-100" onclick="saveSettings()">Simpan Perubahan</button>
        </form>
      </div>
    </div>

  </div>

  <!-- NAVIGATION BOTTOM BAR -->
  <div id="bottomNav" class="bottom-nav d-none">
    <button class="nav-item active" onclick="switchTab('dashboard-page', this)">
      <i class="bi bi-house-door"></i> Utama
    </button>
    <button class="nav-item" onclick="switchTab('rekap-page', this)">
      <i class="bi bi-journal-text"></i> Rekap
    </button>
    <button class="btn-fingerprint" onclick="switchTab('absen-page', this)">
      <i class="bi bi-fingerprint"></i>
    </button>
    <button class="nav-item" onclick="switchTab('setting-page', this)">
      <i class="bi bi-gear"></i> Setting
    </button>
    <button class="nav-item text-danger" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i> Keluar
    </button>
  </div>

  <!-- JS Dependencies -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // ISI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";

    let currentUser = null;
    let userLat = 0;
    let userLng = 0;
    let map = null;
    let marker = null;
    let videoStream = null;
    let currentDateStr = "";

    // Toggle Password Visibility
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
      }
    }

    // Login Event Handler
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const nik = document.getElementById("loginNik").value;
      const pass = document.getElementById("loginPassword").value;

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", nik: nik, password: pass })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          currentUser = data.user;
          localStorage.setItem("user_absensi", JSON.stringify(currentUser));
          initApp();
        } else {
          alert(data.message);
        }
      }).catch(err => alert("Gagal terhubung ke Server"));
    });

    function initApp() {
      const savedUser = localStorage.getItem("user_absensi");
      if (savedUser) currentUser = JSON.parse(savedUser);
      if (!currentUser) return;

      document.getElementById("login-section").classList.add("d-none");
      document.getElementById("bottomNav").classList.remove("d-none");
      
      switchTab("dashboard-page");
      initGPS();
      loadDashboardData();
      startServerClock();
    }

    // Navigasi Tab
    function switchTab(pageId, element) {
      document.querySelectorAll(".page-content").forEach(el => el.classList.add("d-none"));
      document.getElementById(pageId).classList.remove("d-none");

      if (element && !element.classList.contains("btn-fingerprint")) {
        document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
        element.classList.add("active");
      }

      if (pageId === "absen-page") startCamera();
      else stopCamera();

      if (pageId === "rekap-page") loadRekap();
      if (pageId === "setting-page") fillSettings();
    }

    // Geolocation / GPS
    function initGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          pos => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            document.getElementById("geoStatus").innerText = `Lat: ${userLat.toFixed(5)}, Lng: ${userLng.toFixed(5)}`;
            updateMap(userLat, userLng);
          },
          err => { document.getElementById("geoStatus").innerText = "Gagal Mengambil GPS. Aktifkan Izin Lokasi!"; },
          { enableHighAccuracy: true }
        );
      }
    }

    function updateMap(lat, lng) {
      if (!map) {
        map = L.map('map').setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.marker([lat, lng]).addTo(map);
      } else {
        map.setView([lat, lng]);
        marker.setLatLng([lat, lng]);
      }
    }

    // Sinkronisasi Jam & Auto Refresh Tanggal
    function startServerClock() {
      setInterval(() => {
        fetch(`${SCRIPT_URL}?action=getServerTime`)
          .then(res => res.json())
          .then(data => {
            document.getElementById("dashJam").innerText = data.time;
            document.getElementById("dashTanggal").innerText = data.date;

            // Auto refresh jika berganti tanggal
            if (currentDateStr !== "" && currentDateStr !== data.date) {
              loadDashboardData();
            }
            currentDateStr = data.date;
          });
      }, 1000);
    }

    function loadDashboardData() {
      document.getElementById("dashNama").innerText = currentUser.nama;
      document.getElementById("dashUnit").innerText = currentUser.unitKerja;

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getDashboardData", nik: currentUser.nik })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          document.getElementById("dashMasuk").innerText = data.jamMasuk;
          document.getElementById("dashPulang").innerText = data.jamPulang;
        }
      });
    }

    // Kamera / Face Capture
    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
          videoStream = stream;
          document.getElementById("webcam").srcObject = stream;
        })
        .catch(() => alert("Kamera tidak dapat diakses"));
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    function processAbsen(type) {
      if (!userLat || !userLng) {
        alert("Lokasi GPS belum ditemukan. Mohon tunggu.");
        return;
      }

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "doAbsen",
          nik: currentUser.nik,
          type: type,
          userLat: userLat,
          userLng: userLng
        })
      })
      .then(res => res.json())
      .then(data => {
        alert(data.message);
        if (data.status === "success") {
          if (type === "masuk") document.getElementById("dashMasuk").innerText = data.timeStr;
          if (type === "pulang") document.getElementById("dashPulang").innerText = data.timeStr;
          switchTab("dashboard-page");
        }
      });
    }

    // Rekap Presensi
    function loadRekap() {
      const filter = document.getElementById("filterTanggal").value;
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getRekap", nik: currentUser.nik, tanggal: filter })
      })
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("rekapTable");
        tbody.innerHTML = "";
        if (data.status === "success") {
          data.rekap.forEach(row => {
            tbody.innerHTML += `<tr>
              <td>${row.tanggal}</td>
              <td>${row.jamMasuk}</td>
              <td>${row.jamPulang}</td>
            </tr>`;
          });
        }
      });
    }

    // Settings
    function fillSettings() {
      document.getElementById("setNik").value = currentUser.nik;
      document.getElementById("setNama").value = currentUser.nama;
      document.getElementById("setUnit").value = currentUser.unitKerja;
    }

    function saveSettings() {
      const payload = {
        action: "updateProfile",
        nik: currentUser.nik,
        nama: document.getElementById("setNama").value,
        unitKerja: document.getElementById("setUnit").value,
        password: document.getElementById("setPass").value
      };

      fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
          alert(data.message);
          if (data.status === "success") {
            currentUser.nama = payload.nama;
            currentUser.unitKerja = payload.unitKerja;
            localStorage.setItem("user_absensi", JSON.stringify(currentUser));
            loadDashboardData();
          }
        });
    }

    function logout() {
      localStorage.removeItem("user_absensi");
      location.reload();
    }

    // Auto Login jika terdeteksi session
    window.onload = function() {
      if (localStorage.getItem("user_absensi")) {
        initApp();
      }
    };
  </script>
</body>
</html>
