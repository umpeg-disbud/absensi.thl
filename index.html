<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Mobile</title>
  
  <!-- Font Awesome & Leaflet CSS (Map) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
    
    .header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; }
    .container { padding: 15px; max-width: 480px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    .input-group { position: relative; margin-bottom: 12px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .toggle-pass { position: absolute; right: 12px; top: 12px; color: #64748b; cursor: pointer; }
    
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
    .btn-danger { background: #ef4444; }
    
    #map { height: 180px; border-radius: 8px; margin-top: 10px; }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #64748b; text-decoration: none; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-item i { font-size: 18px; margin-bottom: 3px; }
    
    .camera-box { width: 100%; height: 220px; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; }
    
    .hidden { display: none !important; }
    .time-badge { font-size: 24px; font-weight: bold; text-align: center; color: var(--primary); }
    .date-badge { font-size: 14px; text-align: center; color: #64748b; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="header">Absensi Online Mobile</div>

  <div class="container">
    <!-- View Login -->
    <div id="view-login" class="card">
      <h3 style="margin-bottom: 15px; text-align: center;">Masuk Akun</h3>
      <div class="input-group">
        <input type="text" id="login-nik" placeholder="NIK (16 Teks Angka)" maxlength="16">
      </div>
      <div class="input-group">
        <input type="password" id="login-password" placeholder="Password">
        <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword('login-password', this)"></i>
      </div>
      <button class="btn" onclick="login()">LOGIN</button>
    </div>

    <!-- View Utama / Presensi -->
    <div id="view-home" class="hidden">
      <div class="card">
        <div class="date-badge" id="current-date">--/--/----</div>
        <div class="time-badge" id="current-time">00:00:00</div>
      </div>

      <div class="card">
        <h4 style="margin-bottom:8px;"><i class="fa-solid fa-location-dot"></i> Lokasi GPS Anda</h4>
        <div id="gps-status" style="font-size:12px; color:#64748b;">Mencari Sinyal GPS...</div>
        <div id="map"></div>
      </div>

      <div class="card">
        <h4 style="margin-bottom:8px;"><i class="fa-solid fa-camera"></i> Ambil Selfie Wajah</h4>
        <div class="camera-box">
          <video id="webcam" autoplay playsinline></video>
          <canvas id="canvas" class="hidden"></canvas>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button class="btn" onclick="prosesAbsen('masuk')"><i class="fa-solid fa-right-to-bracket"></i> Jam Masuk</button>
          <button class="btn btn-danger" onclick="prosesAbsen('pulang')"><i class="fa-solid fa-right-from-bracket"></i> Jam Pulang</button>
        </div>
      </div>
    </div>

    <!-- View Rekap -->
    <div id="view-rekap" class="hidden">
      <div class="card">
        <h3>Rekap Presensi</h3>
        <div id="rekap-list" style="margin-top:10px; font-size:13px;">Memuat...</div>
      </div>
    </div>

    <!-- View Profil / Setting -->
    <div id="view-profil" class="hidden">
      <div class="card">
        <h3>Data Pribadi</h3>
        <br>
        <p><strong>NIK:</strong> <span id="p-nik"></span></p>
        <p><strong>Nama:</strong> <span id="p-nama"></span></p>
        <p><strong>Unit Kerja:</strong> <span id="p-unit"></span></p>
      </div>

      <div class="card">
        <h3>Edit Data & Password</h3>
        <br>
        <div class="input-group">
          <input type="text" id="edit-nama" placeholder="Nama Baru">
        </div>
        <div class="input-group">
          <input type="text" id="edit-unit" placeholder="Unit Kerja Baru">
        </div>
        <div class="input-group">
          <input type="password" id="edit-pass" placeholder="Password Baru">
          <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword('edit-pass', this)"></i>
        </div>
        <button class="btn" onclick="simpanSetting()">Simpan Perubahan</button>
        <br><br>
        <button class="btn btn-danger" onclick="logout()">Keluar</button>
      </div>
    </div>

  </div>

  <!-- Modern Bottom Nav Bar -->
  <div class="nav-bar hidden" id="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home', this)">
      <i class="fa-solid fa-house"></i>
      <span>Absen</span>
    </div>
    <div class="nav-item" onclick="switchTab('rekap', this)">
      <i class="fa-solid fa-list-check"></i>
      <span>Rekap</span>
    </div>
    <div class="nav-item" onclick="switchTab('profil', this)">
      <i class="fa-solid fa-user-gear"></i>
      <span>Setting</span>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // MASUKKAN WEB APP URL DARI GOOGLE APPS SCRIPT DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFjDvlnW3WzUucYqrdSwZJlLSiTahAP6x6GW0Fo-7YABcw2aKVvED_NKkZ7bYTu2s5yA/exec";

    let currentUser = null;
    let currentLat = null, currentLng = null;
    let map = null, marker = null;
    let stream = null;
    let currentDateStr = "";

    window.onload = () => {
      startClock();
      checkAutoRefreshDate();
    };

    function startClock() {
      setInterval(() => {
        const now = new Date();
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        
        const newDateStr = `${dd}-${mm}-${yyyy}`;
        if (currentDateStr !== "" && currentDateStr !== newDateStr) {
          location.reload(); // Refresh otomatis jika pergantian hari
        }
        currentDateStr = newDateStr;

        document.getElementById("current-date").innerText = newDateStr;
        document.getElementById("current-time").innerText = now.toTimeString().split(' ')[0];
      }, 1000);
    }

    function checkAutoRefreshDate() {
      // Pengecekan setiap menit
      setInterval(() => {
        const now = new Date();
        if (now.getHours() === 0 && now.getMinutes() === 0) {
          location.reload();
        }
      }, 60000);
    }

    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    async function apiCall(payload) {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    async function login() {
      const nik = document.getElementById("login-nik").value;
      const pass = document.getElementById("login-password").value;
      if (!nik || !pass) return alert("Lengkapi NIK dan Password!");

      const res = await apiCall({ action: "login", nik: nik, password: pass });
      if (res.success) {
        currentUser = res.user;
        document.getElementById("view-login").classList.add("hidden");
        document.getElementById("view-home").classList.remove("hidden");
        document.getElementById("bottom-nav").classList.remove("hidden");
        
        initProfilData();
        initGPS();
        initCamera();
      } else {
        alert(res.message);
      }
    }

    function logout() {
      location.reload();
    }

    function initGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(position => {
          currentLat = position.coords.latitude;
          currentLng = position.coords.longitude;
          document.getElementById("gps-status").innerText = `Lat: ${currentLat.toFixed(5)}, Lng: ${currentLng.toFixed(5)}`;
          
          if (!map) {
            map = L.map('map').setView([currentLat, currentLng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([currentLat, currentLng]).addTo(map);
          } else {
            marker.setLatLng([currentLat, currentLng]);
            map.panTo([currentLat, currentLng]);
          }
        }, err => {
          document.getElementById("gps-status").innerText = "Gagal mengambil lokasi GPS.";
        }, { enableHighAccuracy: true });
      }
    }

    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        document.getElementById("webcam").srcObject = stream;
      } catch (err) {
        alert("Akses kamera ditolak atau tidak tersedia!");
      }
    }

    function capturePhoto() {
      const video = document.getElementById("webcam");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.7);
    }

    async function prosesAbsen(tipe) {
      if (!currentLat || !currentLng) return alert("Lokasi GPS belum didapatkan!");
      
      const photoBase64 = capturePhoto();
      const jamNow = document.getElementById("current-time").innerText;

      const payload = {
        action: "absensi",
        nik: currentUser.nik,
        tanggal: currentDateStr,
        jam: jamNow,
        lat: currentLat,
        lng: currentLng,
        tipe: tipe,
        photoBase64: photoBase64
      };

      const res = await apiCall(payload);
      alert(res.message);
    }

    function switchTab(tab, el) {
      document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
      el.classList.add("active");

      document.getElementById("view-home").classList.add("hidden");
      document.getElementById("view-rekap").classList.add("hidden");
      document.getElementById("view-profil").classList.add("hidden");

      if (tab === 'home') {
        document.getElementById("view-home").classList.remove("hidden");
      } else if (tab === 'rekap') {
        document.getElementById("view-rekap").classList.remove("hidden");
        loadRekap();
      } else if (tab === 'profil') {
        document.getElementById("view-profil").classList.remove("hidden");
      }
    }

    async function loadRekap() {
      const listContainer = document.getElementById("rekap-list");
      listContainer.innerHTML = "Memuat data...";
      const res = await apiCall({ action: "getRekap", nik: currentUser.nik });
      
      if (res.success && res.data.length > 0) {
        let html = "";
        res.data.reverse().forEach(item => {
          html += `<div style="border-bottom: 1px solid #e2e8f0; padding: 8px 0;">
            <strong>Tgl: ${item.tanggal}</strong><br>
            Masuk: ${item.jamMasuk || '-'} | Pulang: ${item.jamPulang || '-'}<br>
            <small><a href="${item.foto}" target="_blank">Lihat Foto Selfie</a></small>
          </div>`;
        });
        listContainer.innerHTML = html;
      } else {
        listContainer.innerHTML = "Belum ada riwayat absensi.";
      }
    }

    function initProfilData() {
      document.getElementById("p-nik").innerText = currentUser.nik;
      document.getElementById("p-nama").innerText = currentUser.nama;
      document.getElementById("p-unit").innerText = currentUser.unitKerja;
      
      document.getElementById("edit-nama").value = currentUser.nama;
      document.getElementById("edit-unit").value = currentUser.unitKerja;
    }

    async function simpanSetting() {
      const nama = document.getElementById("edit-nama").value;
      const unit = document.getElementById("edit-unit").value;
      const pass = document.getElementById("edit-pass").value;

      const res = await apiCall({
        action: "updateProfil",
        nik: currentUser.nik,
        nama: nama,
        unitKerja: unit,
        password: pass
      });

      alert(res.message);
      if (res.success) {
        currentUser.nama = nama;
        currentUser.unitKerja = unit;
        initProfilData();
      }
    }
  </script>
</body>
</html>
