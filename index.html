<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  <!-- Bootstrap & Leaflet CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 70px; }
    .card { border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    #clock { font-size: 2.5rem; font-weight: bold; color: #0d6efd; }
    #map { height: 180px; border-radius: 12px; margin-top: 10px; z-index: 1; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
    .nav-item-btn { text-align: center; color: #6c757d; font-size: 0.8rem; border: none; background: none; }
    .nav-item-btn.active { color: #0d6efd; font-weight: bold; }
    .nav-item-btn i { font-size: 1.4rem; display: block; }
    .btn-finger { width: 65px; height: 65px; border-radius: 50%; background: #0d6efd; color: #fff; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(13,110,253,0.4); margin-top: -25px; }
    #cameraView { width: 100%; max-width: 320px; border-radius: 15px; transform: scaleX(-1); }
  </style>
</head>
<body>

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-5">
        <div class="card p-4 text-center">
          <h3 class="fw-bold mb-4 text-primary"><i class="bi bi-person-badge"></i> Absensi Online</h3>
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="loginNik" placeholder="16 Digit NIK" maxlength="16">
            <label for="loginNik">NIK (16 Teks Angka)</label>
          </div>
          <div class="input-group mb-3">
            <div class="form-floating flex-grow-1">
              <input type="password" class="form-control" id="loginPassword" placeholder="Password">
              <label for="loginPassword">Password</label>
            </div>
            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword', 'eyeIcon1')">
              <i class="bi bi-eye" id="eyeIcon1"></i>
            </button>
          </div>
          <button class="btn btn-primary w-100 py-2 fs-5" onclick="login()">Masuk</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appPages" style="display: none;">
    <!-- HOME PAGE -->
    <div id="pageHome" class="container py-3">
      <div class="card p-3 mb-3 text-center">
        <h5 id="userName" class="fw-bold mb-0">-</h5>
        <small id="userUnit" class="text-muted">-</small>
        <div class="mt-2 text-secondary" id="currentDate">-</div>
        <div id="clock">00:00:00</div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <div class="card p-3 text-center border-start border-4 border-success">
            <small class="text-muted">Jam Masuk</small>
            <h5 id="jamMasukVal" class="fw-bold text-success mb-0">-</h5>
          </div>
        </div>
        <div class="col-6">
          <div class="card p-3 text-center border-start border-4 border-danger">
            <small class="text-muted">Jam Pulang</small>
            <h5 id="jamPulangVal" class="fw-bold text-danger mb-0">-</h5>
          </div>
        </div>
      </div>

      <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center">
          <small class="fw-bold text-secondary"><i class="bi bi-geo-alt-fill text-danger"></i> Titik Koordinat Anda</small>
          <small id="gpsStatus" class="badge bg-secondary">Mencari GPS...</small>
        </div>
        <div id="map"></div>
      </div>
    </div>

    <!-- REKAP PAGE -->
    <div id="pageRekap" class="container py-3" style="display:none;">
      <h5 class="fw-bold mb-3"><i class="bi bi-calendar-check"></i> Rekap Presensi</h5>
      <div class="card p-3">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Masuk</th>
                <th>Pulang</th>
              </tr>
            </thead>
            <tbody id="rekapTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- SETTINGS PAGE -->
    <div id="pageSettings" class="container py-3" style="display:none;">
      <h5 class="fw-bold mb-3"><i class="bi bi-gear"></i> Pengaturan Akun</h5>
      <div class="card p-3">
        <h6>Ubah Password</h6>
        <div class="input-group mb-3">
          <div class="form-floating flex-grow-1">
            <input type="password" class="form-control" id="oldPass" placeholder="Password Lama">
            <label for="oldPass">Password Lama</label>
          </div>
          <button class="btn btn-outline-secondary" onclick="togglePassword('oldPass', 'eyeIcon2')"><i class="bi bi-eye" id="eyeIcon2"></i></button>
        </div>
        <div class="input-group mb-3">
          <div class="form-floating flex-grow-1">
            <input type="password" class="form-control" id="newPass" placeholder="Password Baru">
            <label for="newPass">Password Baru</label>
          </div>
          <button class="btn btn-outline-secondary" onclick="togglePassword('newPass', 'eyeIcon3')"><i class="bi bi-eye" id="eyeIcon3"></i></button>
        </div>
        <button class="btn btn-primary w-100" onclick="changePassword()">Simpan Password</button>
      </div>
    </div>

    <!-- BOTTOM NAVBAR -->
    <div class="bottom-nav">
      <button class="nav-item-btn active" id="navHome" onclick="switchTab('home')">
        <i class="bi bi-house-door"></i> Home
      </button>
      <button class="nav-item-btn" id="navRekap" onclick="switchTab('rekap')">
        <i class="bi bi-journal-text"></i> Rekap
      </button>
      <button class="nav-item-btn" onclick="openAbsenModal()">
        <div class="btn-finger"><i class="bi bi-fingerprint"></i></div>
      </button>
      <button class="nav-item-btn" id="navSettings" onclick="switchTab('settings')">
        <i class="bi bi-gear"></i> Setting
      </button>
      <button class="nav-item-btn text-danger" onclick="logout()">
        <i class="bi bi-box-arrow-right"></i> Keluar
      </button>
    </div>
  </div>

  <!-- ABSEN MODAL (CAMERA & SELFIE) -->
  <div class="modal fade" id="absenModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold"><i class="bi bi-camera"></i> Verifikasi Face Selfie</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="stopCamera()"></button>
        </div>
        <div class="modal-body text-center">
          <video id="cameraView" autoplay playsinline></video>
          <canvas id="canvas" style="display:none;"></canvas>
          <div class="mt-3 d-flex justify-content-center gap-2">
            <button class="btn btn-success w-50 py-2" onclick="doAbsen('masuk')"><i class="bi bi-box-arrow-in-right"></i> Jam Masuk</button>
            <button class="btn btn-danger w-50 py-2" onclick="doAbsen('pulang')"><i class="bi bi-box-arrow-right"></i> Jam Pulang</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // MASUKKAN URL DEPLOY WEB APP GOOGLE APPS SCRIPT DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";

    let currentUser = null;
    let currentLat = 0;
    let currentLng = 0;
    let map, marker;
    let videoStream = null;
    let lastLoadedDate = "";

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("bi-eye", "bi-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("bi-eye-slash", "bi-eye");
      }
    }

    async function apiPost(data) {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(data)
      });
      return await response.json();
    }

    async function login() {
      const nik = document.getElementById("loginNik").value;
      const password = document.getElementById("loginPassword").value;
      if (!nik || !password) return alert("NIK dan Password wajib diisi!");

      const res = await apiPost({ action: "login", nik: nik, password: password });
      if (res.success) {
        currentUser = res.user;
        localStorage.setItem("user_nik", nik);
        initApp();
      } else {
        alert(res.message);
      }
    }

    function logout() {
      localStorage.removeItem("user_nik");
      location.reload();
    }

    function initApp() {
      document.getElementById("loginPage").style.display = "none";
      document.getElementById("appPages").style.display = "block";
      initGPS();
      loadDashboard();
      setInterval(loadDashboard, 1000); // Sync Jam Server & auto refresh tanggal
    }

    async function loadDashboard() {
      const nik = localStorage.getItem("user_nik");
      if (!nik) return;

      const res = await apiPost({ action: "getDashboard", nik: nik });
      if (res.success) {
        document.getElementById("userName").innerText = res.user.nama;
        document.getElementById("userUnit").innerText = res.user.unitKerja;
        document.getElementById("clock").innerText = res.serverTime;
        document.getElementById("currentDate").innerText = res.serverDate;
        document.getElementById("jamMasukVal").innerText = res.jamMasuk;
        document.getElementById("jamPulangVal").innerText = res.jamPulang;

        // Auto Refresh jika tanggal berganti
        if (lastLoadedDate !== "" && lastLoadedDate !== res.serverDate) {
          location.reload();
        }
        lastLoadedDate = res.serverDate;
      }
    }

    function initGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById("gpsStatus").innerText = "GPS Aktif";
            document.getElementById("gpsStatus").className = "badge bg-success";
            updateMap(currentLat, currentLng);
          },
          (err) => {
            document.getElementById("gpsStatus").innerText = "GPS Gagal/Mati";
            document.getElementById("gpsStatus").className = "badge bg-danger";
          },
          { enableHighAccuracy: true }
        );
      }
    }

    function updateMap(lat, lng) {
      if (!map) {
        map = L.map('map').setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        marker = L.marker([lat, lng]).addTo(map);
      } else {
        marker.setLatLng([lat, lng]);
        map.panTo([lat, lng]);
      }
    }

    function switchTab(tab) {
      document.getElementById("pageHome").style.display = tab === 'home' ? 'block' : 'none';
      document.getElementById("pageRekap").style.display = tab === 'rekap' ? 'block' : 'none';
      document.getElementById("pageSettings").style.display = tab === 'settings' ? 'block' : 'none';

      document.querySelectorAll('.bottom-nav .nav-item-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'home') document.getElementById('navHome').classList.add('active');
      if (tab === 'rekap') {
        document.getElementById('navRekap').classList.add('active');
        loadRekap();
      }
      if (tab === 'settings') document.getElementById('navSettings').classList.add('active');
    }

    async function loadRekap() {
      const res = await apiPost({ action: "getRekap", nik: localStorage.getItem("user_nik") });
      if (res.success) {
        const tbody = document.getElementById("rekapTableBody");
        tbody.innerHTML = "";
        res.rekap.forEach(r => {
          tbody.innerHTML += `<tr>
            <td>${r.tanggal}</td>
            <td class="text-success">${r.jamMasuk}</td>
            <td class="text-danger">${r.jamPulang}</td>
          </tr>`;
        });
      }
    }

    function openAbsenModal() {
      const modal = new bootstrap.Modal(document.getElementById('absenModal'));
      modal.show();
      startCamera();
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then((stream) => {
          videoStream = stream;
          document.getElementById("cameraView").srcObject = stream;
        })
        .catch((err) => alert("Kamera gagal diakses: " + err));
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
    }

    async function doAbsen(type) {
      if (currentLat === 0 && currentLng === 0) {
        return alert("Lokasi GPS belum terdeteksi. Pastikan izin GPS diaktifkan!");
      }

      const res = await apiPost({
        action: "absen",
        nik: localStorage.getItem("user_nik"),
        type: type,
        lat: currentLat,
        lng: currentLng
      });

      alert(res.message);
      if (res.success) {
        stopCamera();
        bootstrap.Modal.getInstance(document.getElementById('absenModal')).hide();
        loadDashboard();
      }
    }

    async function changePassword() {
      const oldPass = document.getElementById("oldPass").value;
      const newPass = document.getElementById("newPass").value;
      if (!oldPass || !newPass) return alert("Semua kolom harus diisi!");

      const res = await apiPost({
        action: "changePassword",
        nik: localStorage.getItem("user_nik"),
        oldPassword: oldPass,
        newPassword: newPass
      });

      alert(res.message);
      if (res.success) {
        document.getElementById("oldPass").value = "";
        document.getElementById("newPass").value = "";
      }
    }

    // Auto Login Check
    window.onload = () => {
      if (localStorage.getItem("user_nik")) {
        initApp();
      }
    };
  </script>
</body>
</html>
