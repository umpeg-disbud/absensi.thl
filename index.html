<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Leaflet CSS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- PAGE LOGIN -->
  <div id="login-page" class="page active">
    <div class="card login-card">
      <i class="fa-solid fa-user-shield logo-icon"></i>
      <h2>Absensi Online</h2>
      <form id="login-form">
        <div class="input-group">
          <i class="fa-solid fa-id-card"></i>
          <input type="text" id="login-nik" maxlength="16" placeholder="NIK (16 Digit)" required>
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="login-password" placeholder="Password" required>
          <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
        </div>
        <button type="submit" class="btn btn-primary">Masuk</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-container" class="hidden">
    
    <!-- HEADER -->
    <header class="app-header">
      <div class="user-info">
        <span id="user-name">Nama User</span>
        <small id="user-unit">Unit Kerja</small>
      </div>
      <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </header>

    <!-- CONTENT SECTIONS -->
    <main class="app-content">
      
      <!-- TAB 1: HALAMAN UTAMA -->
      <section id="tab-home" class="tab-content active">
        <div class="clock-card">
          <div id="server-date" class="date-display">00-00-0000</div>
          <div id="server-time" class="time-display">00:00:00</div>
          <div class="timezone-badge">WIB (Server Google)</div>
        </div>

        <div class="status-grid">
          <div class="status-box">
            <small>Jam Masuk</small>
            <h3 id="jam-masuk-display">--:--</h3>
          </div>
          <div class="status-box">
            <small>Jam Pulang</small>
            <h3 id="jam-pulang-display">--:--</h3>
          </div>
        </div>

        <div class="map-card">
          <h4><i class="fa-solid fa-location-dot"></i> Lokasi Saya</h4>
          <div id="map"></div>
          <small id="gps-coords">Mengambil lokasi GPS...</small>
        </div>
      </section>

      <!-- TAB 2: REKAP PRESENSI -->
      <section id="tab-rekap" class="tab-content">
        <h3>Rekap Presensi</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Masuk</th>
                <th>Pulang</th>
              </tr>
            </thead>
            <tbody id="rekap-list">
              <!-- Render via JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- TAB 3: SETTING -->
      <section id="tab-setting" class="tab-content">
        <h3>Pengaturan Profil</h3>
        <form id="setting-form">
          <div class="input-group">
            <label>NIK</label>
            <input type="text" id="setting-nik" disabled>
          </div>
          <div class="input-group">
            <label>Nama</label>
            <input type="text" id="setting-nama" required>
          </div>
          <div class="input-group">
            <label>Unit Kerja</label>
            <input type="text" id="setting-unit" required>
          </div>
          <div class="input-group">
            <label>Password Baru</label>
            <input type="password" id="setting-password" placeholder="Ubah Password">
            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('setting-password', this)"></i>
          </div>
          <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
        </form>
      </section>

    </main>

    <!-- NAVIGATION BAR -->
    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('tab-home', this)">
        <i class="fa-solid fa-house"></i>
        <span>Utama</span>
      </button>
      <button class="nav-btn" onclick="switchTab('tab-rekap', this)">
        <i class="fa-solid fa-calendar-check"></i>
        <span>Rekap</span>
      </button>
      
      <!-- TOMBOL SIDIK JARI ABSEN (DI TENGAH) -->
      <button class="nav-btn btn-fingerprint" onclick="openAbsenModal()">
        <i class="fa-solid fa-fingerprint"></i>
      </button>

      <button class="nav-btn" onclick="switchTab('tab-setting', this)">
        <i class="fa-solid fa-gear"></i>
        <span>Setting</span>
      </button>
      <button class="nav-btn" onclick="logout()">
        <i class="fa-solid fa-power-off"></i>
        <span>Keluar</span>
      </button>
    </nav>
  </div>

  <!-- MODAL CAMERA / SELFIE ABSENSI -->
  <div id="modal-absen" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeAbsenModal()">&times;</span>
      <h3>Selfie & Presensi</h3>
      <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas" class="hidden"></canvas>
      </div>
      <div class="absen-actions">
        <button class="btn btn-success" onclick="executeAbsen('masuk')">
          <i class="fa-solid fa-arrow-down-to-bracket"></i> Jam Masuk
        </button>
        <button class="btn btn-danger" onclick="executeAbsen('pulang')">
          <i class="fa-solid fa-arrow-up-from-bracket"></i> Jam Pulang
        </button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
