<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi Mobile</title>
  
  <!-- CSS Framework & Leaflet Maps -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; }
    
    .container { max-width: 480px; margin: 0 auto; padding: 15px; }
    .card { background: var(--card); padding: 18px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h2, h3 { margin-bottom: 12px; color: var(--primary); }
    
    .form-group { margin-bottom: 12px; position: relative; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
    .toggle-pass { position: absolute; right: 12px; top: 32px; cursor: pointer; color: #64748b; }
    
    .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-secondary { background: #64748b; }
    .btn-danger { background: #ef4444; }
    
    #map { height: 180px; width: 100%; border-radius: 8px; margin-top: 10px; }
    .video-container { width: 100%; height: 200px; background: #000; border-radius: 8px; overflow: hidden; position: relative; margin-bottom: 10px; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e2e8f0; max-width: 480px; margin: 0 auto; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: #64748b; cursor: pointer; text-decoration: none; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-item i { font-size: 1.2rem; margin-bottom: 2px; }

    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 9999; display: none; }
    .hidden { display: none !important; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8rem; }
    th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <!-- VIEW LOGIN -->
  <div id="view-login" class="container">
    <div class="card" style="margin-top: 50px;">
      <h2><i class="fa-solid fa-user-check"></i> Absensi Online</h2>
      <form id="form-login">
        <div class="form-group">
          <label>NIK (16 Digit)</label>
          <input type="number" id="login-nik" required placeholder="Masukkan NIK">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pass" required placeholder="Masukkan Password">
          <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword('login-pass', this)"></i>
        </div>
        <button type="submit" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button>
      </form>
    </div>
  </div>

  <!-- APP CONTENT (Hidden default) -->
  <div id="app-content" class="hidden">
    
    <!-- PAGE 1: ABSENSI -->
    <div id="page-absen" class="container page">
      <div class="card">
        <h3 id="user-greeting">Halo, User</h3>
        <p style="font-size: 0.85rem; color: #64748b;" id="user-unit">Unit Kerja: -</p>
        <hr style="margin: 10px 0; border: 0; border-top: 1px solid #e2e8f0;">
        <p><strong>Tanggal:</strong> <span id="clock-date">--/--/----</span></p>
        <p><strong>Waktu Saat Ini:</strong> <span id="clock-time">00:00:00</span></p>
        <p style="font-size: 0.8rem; margin-top: 5px;"><strong>GPS:</strong> <span id="gps-status">Mencari lokasi...</span></p>
        <div id="map"></div>
      </div>

      <div class="card">
        <h3>Ambil Selfie</h3>
        <div class="video-container">
          <video id="webcam" autoplay playsinline></video>
          <canvas id="canvas" class="hidden"></canvas>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn" onclick="takeAbsen('masuk')"><i class="fa-solid fa-right-to-bracket"></i> Jam Masuk</button>
          <button class="btn btn-secondary" onclick="takeAbsen('pulang')"><i class="fa-solid fa-right-from-bracket"></i> Jam Pulang</button>
        </div>
      </div>
    </div>

    <!-- PAGE 2: REKAP PRESENSI -->
    <div id="page-rekap" class="container page hidden">
      <div class="card">
        <h3><i class="fa-solid fa-calendar-check"></i> Rekap Presensi</h3>
        <button class="btn" onclick="loadRekap()" style="margin-bottom: 10px;"><i class="fa-solid fa-rotate"></i> Refresh Rekap</button>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>Tgl</th>
                <th>Masuk</th>
                <th>Pulang</th>
                <th>Foto</th>
              </tr>
            </thead>
            <tbody id="rekap-list">
              <tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- PAGE 3: SETTING & PROFIL -->
    <div id="page-setting" class="container page hidden">
      <div class="card">
        <h3><i class="fa-solid fa-user-gear"></i> Data Pribadi & Setting</h3>
        <form id="form-profile">
          <div class="form-group">
            <label>NIK</label>
            <input type="text" id="prof-nik" readonly style="background: #e2e8f0;">
          </div>
          <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="prof-nama" required>
          </div>
          <div class="form-group">
            <label>Unit Kerja</label>
            <input type="text" id="prof-unit" required>
          </div>
          <div class="form-group">
            <label>Password Baru</label>
            <input type="password" id="prof-pass" placeholder="Isi untuk ubah password">
            <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword('prof-pass', this)"></i>
          </div>
          <button type="submit" class="btn" style="margin-bottom: 10px;"><i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan</button>
          <button type="button" class="btn btn-danger" onclick="logout()"><i class="fa-solid fa-power-off"></i> Keluar</button>
        </form>
      </div>
    </div>

    <!-- BOTTOM NAVBAR -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchPage('absen', this)"><i class="fa-solid fa-camera"></i> Absen</div>
      <div class="nav-item" onclick="switchPage('rekap', this)"><i class="fa-solid fa-list-check"></i> Rekap</div>
      <div class="nav-item" onclick="switchPage('setting', this)"><i class="fa-solid fa-gear"></i> Setting</div>
    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // **GANTI URL INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA**
    const SCRIPT_URL = "GANTI_DENGAN_WEB_APP_URL_GAS";

    let currentUser = null;
    let currentLat = null;
    let currentLng = null;
    let map, marker;
    let videoStream = null;

    // --- UTILS ---
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // --- JAM & TANGGAL REALTIME ---
    function updateClock() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      
      document.getElementById("clock-date").innerText = `${dd}-${mm}-${yyyy}`;
      document.getElementById("clock-time").innerText = now.toTimeString().split(' ')[0];

      // Reset otomatis jika melewati midnight (00:00:01)
      if (now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() === 1) {
        location.reload();
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- GPS REALTIME ---
    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById("gps-status").innerText = `${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`;
            
            if (!map) {
              map = L.map('map').setView([currentLat, currentLng], 17);
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
              marker = L.marker([currentLat, currentLng]).addTo(map).bindPopup("Lokasi Anda").openPopup();
            } else {
              marker.setLatLng([currentLat, currentLng]);
              map.panTo([currentLat, currentLng]);
            }
          },
          (err) => { document.getElementById("gps-status").innerText = "Gagal mengakses GPS: " + err.message; },
          { enableHighAccuracy: true, maximumAge: 0 }
        );
      } else {
        document.getElementById("gps-status").innerText = "GPS tidak didukung browser ini.";
      }
    }

    // --- WEBCAM SELFIE ---
    async function initCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        document.getElementById("webcam").srcObject = videoStream;
      } catch (err) {
        showToast("Kamera tidak dapat diakses!");
      }
    }

    // --- NAVIGASI TABS ---
    function switchPage(pageId, el) {
      document.querySelectorAll(".page").forEach(p => p.classList.add("hidden"));
      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
      
      document.getElementById(`page-${pageId}`).classList.remove("hidden");
      el.classList.add("active");

      if (pageId === "rekap") loadRekap();
    }

    // --- AUTH LOGIN ---
    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nik = document.getElementById("login-nik").value;
      const pass = document.getElementById("login-pass").value;

      showToast("Sedang memproses login...");
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "login", nik: nik, password: pass })
        });
        const result = await res.json();

        if (result.success) {
          currentUser = result.user;
          document.getElementById("view-login").classList.add("hidden");
          document.getElementById("app-content").classList.remove("hidden");
          
          document.getElementById("user-greeting").innerText = `Halo, ${currentUser.nama}`;
          document.getElementById("user-unit").innerText = `Unit Kerja: ${currentUser.unitKerja}`;
          document.getElementById("prof-nik").value = currentUser.nik;
          document.getElementById("prof-nama").value = currentUser.nama;
          document.getElementById("prof-unit").value = currentUser.unitKerja;

          initGPS();
          initCamera();
          showToast("Login Berhasil!");
        } else {
          showToast(result.message);
        }
      } catch (err) {
        showToast("Gagal terhubung ke server!");
      }
    });

    // --- AKSI ABSENSI ---
    async function takeAbsen(type) {
      if (!currentLat || !currentLng) {
        showToast("Titik GPS belum terdeteksi!");
        return;
      }

      // Capture Selfie ke Canvas Base64
      const video = document.getElementById("webcam");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const fotoBase64 = canvas.toDataURL("image/jpeg", 0.7);

      const payload = {
        action: "submitAbsen",
        type: type,
        nik: currentUser.nik,
        nama: currentUser.nama,
        unitKerja: currentUser.unitKerja,
        tanggal: document.getElementById("clock-date").innerText,
        jam: document.getElementById("clock-time").innerText,
        lat: currentLat,
        lng: currentLng,
        fotoBase64: fotoBase64
      };

      showToast("Mengirim Absensi...");
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        showToast(result.message);
      } catch (err) {
        showToast("Terjadi kesalahan pengiriman!");
      }
    }

    // --- REKAP DATA ---
    async function loadRekap() {
      const tbody = document.getElementById("rekap-list");
      tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Memuat data...</td></tr>';
      
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getRekap", nik: currentUser.nik })
        });
        const result = await res.json();

        if (result.success && result.data.length > 0) {
          tbody.innerHTML = "";
          result.data.forEach(item => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${item.tanggal}</td>
              <td>${item.jamMasuk}</td>
              <td>${item.jamPulang}</td>
              <td>${item.foto ? `<a href="${item.foto}" target="_blank">Lihat</a>` : '-'}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Belum ada rekap.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Gagal memuat rekap.</td></tr>';
      }
    }

    // --- SIMPAN PROFIL ---
    document.getElementById("form-profile").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        action: "updateProfile",
        nik: currentUser.nik,
        nama: document.getElementById("prof-nama").value,
        unitKerja: document.getElementById("prof-unit").value,
        password: document.getElementById("prof-pass").value
      };

      showToast("Menyimpan...");
      try {
        const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();
        showToast(result.message);
      } catch (err) {
        showToast("Gagal memperbarui profil!");
      }
    });

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
