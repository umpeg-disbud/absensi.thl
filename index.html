<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet OpenStreetMap CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    #map { height: 180px; width: 100%; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

  <!-- APP CONTAINER -->
  <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between">

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="p-6 flex flex-col justify-center min-h-screen">
      <div class="text-center mb-8">
        <div class="bg-blue-600 text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">
          <i class="fa-solid me-0 fa-fingerprint"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">Presensi Mobile</h2>
        <p class="text-sm text-gray-500">Silakan login dengan NIK dan Password</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">NIK (16 Digit)</label>
          <input type="text" id="loginNik" maxlength="16" pattern="\d{16}" required placeholder="Masukkan NIK" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
          <div class="relative">
            <input type="password" id="loginPass" required placeholder="Masukkan Password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <button type="button" onclick="togglePassword('loginPass', 'eyeIcon1')" class="absolute right-3 top-3.5 text-gray-500">
              <i id="eyeIcon1" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-blue-700 transition duration-200">
          Masuk
        </button>
      </form>
    </div>

    <!-- MAIN APP CONTAINER (Hidden before login) -->
    <div id="mainApp" class="hidden flex-1 flex flex-col">

      <!-- HEADER -->
      <div class="bg-blue-600 text-white p-5 rounded-b-2xl shadow-md">
        <div class="flex justify-between items-center mb-2">
          <div>
            <h3 id="userNama" class="text-lg font-bold">Nama User</h3>
            <p id="userUnit" class="text-xs text-blue-200">Unit Kerja</p>
          </div>
          <div class="text-right">
            <span id="currentDate" class="text-xs bg-blue-700 px-2.5 py-1 rounded-full border border-blue-400">dd-MM-yyyy</span>
          </div>
        </div>
      </div>

      <!-- MAIN CONTENT VIEW -->
      <div class="p-4 flex-1">

        <!-- TAB: HALAMAN UTAMA -->
        <div id="tabHome" class="tab-content space-y-4">
          <!-- Live Jam Server -->
          <div class="bg-gray-800 text-white p-4 rounded-xl text-center shadow">
            <p class="text-xs text-gray-400 uppercase tracking-wider">Waktu Server (Asia/Jakarta)</p>
            <h1 id="serverClock" class="text-3xl font-extrabold tracking-widest mt-1">00:00:00</h1>
          </div>

          <!-- Status Absensi Hari Ini -->
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-green-50 p-3 rounded-xl border border-green-200 text-center">
              <p class="text-xs text-green-600 font-semibold mb-1"><i class="fa-solid fa-right-to-bracket mr-1"></i> Jam Masuk</p>
              <p id="timeMasuk" class="text-lg font-bold text-gray-800">-</p>
            </div>
            <div class="bg-red-50 p-3 rounded-xl border border-red-200 text-center">
              <p class="text-xs text-red-600 font-semibold mb-1"><i class="fa-solid fa-right-from-bracket mr-1"></i> Jam Pulang</p>
              <p id="timePulang" class="text-lg font-bold text-gray-800">-</p>
            </div>
          </div>

          <!-- Lokasi Map GPS -->
          <div class="bg-white p-3 rounded-xl shadow border border-gray-200">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold text-gray-700"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i> Titik Koordinat GPS</span>
              <span id="gpsStatus" class="text-[10px] bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded">Mencari Sinyal...</span>
            </div>
            <div id="map"></div>
            <p id="latLngText" class="text-[10px] text-gray-400 text-center mt-2">Lat: - | Lng: -</p>
          </div>
        </div>

        <!-- TAB: REKAP PRESENSI -->
        <div id="tabRekap" class="tab-content hidden space-y-3">
          <h3 class="font-bold text-gray-800 mb-2 text-sm"><i class="fa-solid fa-calendar-check text-blue-600 mr-2"></i>Rekap Presensi Saya</h3>
          <div id="rekapList" class="space-y-2">
            <!-- Dynamically Populated -->
          </div>
        </div>

        <!-- TAB: DATA PRIBADI & SETTING -->
        <div id="tabProfile" class="tab-content hidden space-y-4">
          <div class="bg-white p-4 rounded-xl border border-gray-200 shadow">
            <h3 class="font-bold text-gray-800 mb-3 text-sm">Ubah Data Pribadi & Password</h3>
            <form id="profileForm" class="space-y-3">
              <div>
                <label class="block text-xs font-semibold text-gray-600">Nama Lengkap</label>
                <input type="text" id="editNama" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-600">Unit Kerja</label>
                <input type="text" id="editUnit" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-600">Password Baru</label>
                <div class="relative">
                  <input type="password" id="editPass" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500">
                  <button type="button" onclick="togglePassword('editPass', 'eyeIcon2')" class="absolute right-3 top-3 text-gray-500">
                    <i id="eyeIcon2" class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>
              <button type="submit" class="w-full bg-blue-600 text-white text-sm font-semibold py-2.5 rounded-lg">Simpan Perubahan</button>
            </form>
          </div>
        </div>

      </div>

      <!-- BOTTOM NAVIGATION BAR -->
      <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around items-center py-2 z-20">
        <button onclick="switchTab('tabHome')" class="flex flex-col items-center text-blue-600" id="navHome">
          <i class="fa-solid fa-house text-lg"></i>
          <span class="text-[10px] mt-0.5">Utama</span>
        </button>
        <button onclick="switchTab('tabRekap')" class="flex flex-col items-center text-gray-400" id="navRekap">
          <i class="fa-solid fa-clock-rotate-left text-lg"></i>
          <span class="text-[10px] mt-0.5">Rekap</span>
        </button>
        <!-- Fingerprint Button Absensi Selfie Modal -->
        <button onclick="openAbsenModal()" class="bg-blue-600 text-white p-3.5 rounded-full shadow-lg -mt-5 hover:bg-blue-700">
          <i class="fa-solid fa-fingerprint text-2xl"></i>
        </button>
        <button onclick="switchTab('tabProfile')" class="flex flex-col items-center text-gray-400" id="navProfile">
          <i class="fa-solid fa-user-gear text-lg"></i>
          <span class="text-[10px] mt-0.5">Pengaturan</span>
        </button>
        <button onclick="logout()" class="flex flex-col items-center text-red-500">
          <i class="fa-solid fa-right-from-bracket text-lg"></i>
          <span class="text-[10px] mt-0.5">Keluar</span>
        </button>
      </div>

    </div>

    <!-- MODAL CAMERA / SELFIE FACE RECOGNITION ABSENSI -->
    <div id="absenModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl p-4 w-full max-w-sm space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h4 class="font-bold text-gray-800 text-sm">Ambil Selfie Wajah</h4>
          <button onclick="closeAbsenModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <!-- Camera Area -->
        <div class="relative bg-black rounded-xl overflow-hidden aspect-square flex items-center justify-center">
          <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
          <!-- Face Guide Overlay -->
          <div class="absolute border-2 border-dashed border-green-400 rounded-full w-48 h-60 pointer-events-none opacity-60"></div>
          <canvas id="canvas" class="hidden"></canvas>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button onclick="triggerAbsen('masuk')" class="bg-green-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-green-700">
            <i class="fa-solid fa-right-to-bracket mr-1"></i> Absen Masuk
          </button>
          <button onclick="triggerAbsen('pulang')" class="bg-red-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-red-700">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Absen Pulang
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // MASUKKAN URL WEB APP DEPLOYMENT GOOGLE APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";

    let currentUser = null;
    let currentLat = null;
    let currentLng = null;
    let map = null;
    let marker = null;
    let videoStream = null;

    // Password Toggle Function
    function togglePassword(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(eyeId);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    // Login Handle
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nik = document.getElementById("loginNik").value;
      const password = document.getElementById("loginPass").value;

      const res = await apiCall({ action: "login", nik, password });
      if (res.status === "success") {
        currentUser = res.user;
        initApp();
      } else {
        alert(res.message);
      }
    });

    function initApp() {
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      document.getElementById("userNama").innerText = currentUser.nama;
      document.getElementById("userUnit").innerText = currentUser.unitKerja;
      
      document.getElementById("editNama").value = currentUser.nama;
      document.getElementById("editUnit").value = currentUser.unitKerja;

      initMap();
      startGpsTracking();
      loadTodayStatus();
      startAutoRefreshNextDay();
    }

    // Map & GPS Initialization
    function initMap() {
      map = L.map('map').setView([-6.200000, 106.816666], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
    }

    function startGpsTracking() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          document.getElementById("latLngText").innerText = `Lat: ${currentLat.toFixed(6)} | Lng: ${currentLng.toFixed(6)}`;
          document.getElementById("gpsStatus").innerText = "GPS Aktif";
          document.getElementById("gpsStatus").className = "text-[10px] bg-green-100 text-green-800 px-2 py-0.5 rounded";

          const userPos = [currentLat, currentLng];
          map.setView(userPos, 17);
          if (marker) map.removeLayer(marker);
          marker = L.marker(userPos).addTo(map).bindPopup("Lokasi Anda").openPopup();
        }, (err) => {
          document.getElementById("gpsStatus").innerText = "GPS Gagal";
          document.getElementById("gpsStatus").className = "text-[10px] bg-red-100 text-red-800 px-2 py-0.5 rounded";
        }, { enableHighAccuracy: true });
      }
    }

    // Server Clock & Refresh
    async function loadTodayStatus() {
      const res = await apiCall({ action: "getTodayStatus", nik: currentUser.nik });
      if (res.status === "success") {
        document.getElementById("currentDate").innerText = res.serverDate;
        document.getElementById("timeMasuk").innerText = res.jamMasuk;
        document.getElementById("timePulang").innerText = res.jamPulang;
        
        // Live Clock Sync dengan Jam Server
        let [h, m, s] = res.serverTime.split(':').map(Number);
        setInterval(() => {
          s++;
          if(s>=60){s=0;m++;}
          if(m>=60){m=0;h++;}
          if(h>=24){h=0;}
          document.getElementById("serverClock").innerText = 
            `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);
      }
    }

    function startAutoRefreshNextDay() {
      // Auto refresh halaman jam 00:01 tengah malam untuk pembaruan tanggal
      const now = new Date();
      const night = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 10);
      const msToNight = night.getTime() - now.getTime();
      setTimeout(() => {
        location.reload();
      }, msToNight);
    }

    // Modal & Kamera Selfie
    async function openAbsenModal() {
      document.getElementById("absenModal").classList.remove("hidden");
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById("video").srcObject = videoStream;
      } catch (err) {
        alert("Gagal mengakses kamera selfie: " + err.message);
        closeAbsenModal();
      }
    }

    function closeAbsenModal() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById("absenModal").classList.add("hidden");
    }

    async function triggerAbsen(type) {
      if (!currentLat || !currentLng) {
        alert("Lokasi GPS belum didapatkan! Mohon pastikan GPS diaktifkan.");
        return;
      }

      // Ambil snapshot gambar selfie
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageBase64 = canvas.toDataURL("image/jpeg");

      const res = await apiCall({
        action: "absen",
        nik: currentUser.nik,
        type: type,
        lat: currentLat,
        lng: currentLng,
        image: imageBase64
      });

      alert(res.message);
      if (res.status === "success") {
        closeAbsenModal();
        if (type === "masuk") document.getElementById("timeMasuk").innerText = res.time;
        if (type === "pulang") document.getElementById("timePulang").innerText = res.time;
      }
    }

    // Navigasi Tab
    function switchTab(tabId) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById(tabId).classList.remove("hidden");

      if (tabId === 'tabRekap') loadRekap();
    }

    async function loadRekap() {
      const res = await apiCall({ action: "getRekap", nik: currentUser.nik });
      const container = document.getElementById("rekapList");
      container.innerHTML = "";

      if (res.status === "success" && res.data.length > 0) {
        res.data.forEach(item => {
          container.innerHTML += `
            <div class="bg-white p-3 rounded-lg border border-gray-200 text-xs flex justify-between items-center shadow-sm">
              <div>
                <p class="font-bold text-gray-800">${item.tanggal}</p>
                <p class="text-gray-400 text-[10px]">GPS: ${item.koordinat}</p>
              </div>
              <div class="text-right space-y-0.5">
                <span class="bg-green-100 text-green-700 px-2 py-0.5 rounded font-semibold">M: ${item.jamMasuk}</span>
                <span class="bg-red-100 text-red-700 px-2 py-0.5 rounded font-semibold">P: ${item.jamPulang}</span>
              </div>
            </div>`;
        });
      } else {
        container.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">Belum ada rekap presensi.</p>`;
      }
    }

    // Update Profile
    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nama = document.getElementById("editNama").value;
      const unitKerja = document.getElementById("editUnit").value;
      const password = document.getElementById("editPass").value;

      const res = await apiCall({
        action: "updateProfile",
        nik: currentUser.nik,
        nama, unitKerja, password
      });

      alert(res.message);
      if (res.status === "success") {
        currentUser.nama = nama;
        currentUser.unitKerja = unitKerja;
        document.getElementById("userNama").innerText = nama;
        document.getElementById("userUnit").innerText = unitKerja;
      }
    });

    function logout() {
      location.reload();
    }

    // API Bridge Request tanpa iframe Popup Warning
    async function apiCall(payload) {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (err) {
        return { status: "error", message: "Koneksi ke server terganggu." };
      }
    }
  </script>
</body>
</html>
