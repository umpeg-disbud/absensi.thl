<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  
  <!-- Font Awesome & Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
    .container { flex: 1; max-width: 480px; width: 100%; margin: 0 auto; background: #fff; padding-bottom: 70px; position: relative; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    
    /* Login Page */
    #login-page { padding: 30px 20px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
    .login-header { text-align: center; margin-bottom: 30px; }
    .login-header i { font-size: 50px; color: #007bff; margin-bottom: 10px; }
    .form-group { margin-bottom: 20px; position: relative; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
    .form-group input { width: 100%; padding: 12px 40px 12px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
    .toggle-password { position: absolute; right: 12px; top: 38px; cursor: pointer; color: #777; }
    .btn { width: 100%; padding: 12px; background: #007bff; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    .btn:hover { background: #0056b3; }

    /* Header Main */
    .app-header { background: #007bff; color: white; padding: 15px; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; }
    .user-info h3 { font-size: 18px; margin-bottom: 2px; }
    .user-info p { font-size: 13px; opacity: 0.9; }

    /* Dashboard Main */
    .clock-card { text-align: center; background: #f8f9fa; margin: 15px; padding: 15px; border-radius: 12px; border: 1px solid #e0e0e0; }
    .clock-time { font-size: 32px; font-weight: bold; color: #007bff; }
    .clock-date { font-size: 14px; color: #666; margin-bottom: 10px; }
    
    .status-container { display: flex; justify-content: space-between; margin: 0 15px 15px 15px; }
    .status-box { flex: 1; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 10px; text-align: center; margin: 0 5px; }
    .status-box h4 { font-size: 12px; color: #777; }
    .status-box p { font-size: 16px; font-weight: bold; color: #28a745; margin-top: 5px; }

    #map { height: 180px; margin: 15px; border-radius: 12px; border: 1px solid #ccc; }

    /* Camera Modal / Attendance Submenu */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #fff; width: 90%; max-width: 400px; border-radius: 15px; padding: 20px; text-align: center; }
    #video { width: 100%; border-radius: 10px; transform: scaleX(-1); background: #222; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    .btn-danger { background: #dc3545; }
    .btn-success { background: #28a745; }

    /* Rekap & Setting */
    .page-section { display: none; padding: 15px; }
    .active-section { display: block; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    table th, table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    table th { background: #007bff; color: white; }

    /* Bottom Navigation */
    .navbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid #ddd; display: flex; justify-content: space-around; padding: 8px 0; z-index: 999; }
    .nav-item { border: none; background: none; flex: 1; text-align: center; color: #666; font-size: 11px; cursor: pointer; }
    .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }
    .nav-item.active { color: #007bff; }
    .nav-item.finger-btn { color: #007bff; }
    .nav-item.finger-btn i { font-size: 28px; margin-top: -10px; background: #fff; border-radius: 50%; padding: 5px; border: 2px solid #007bff; }
  </style>
</head>
<body>

<div class="container">
  <!-- LOGIN PAGE -->
  <div id="login-page">
    <div class="login-header">
      <i class="fas fa-user-check"></i>
      <h2>Absensi Online</h2>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>NIK (16 Digit)</label>
        <input type="text" id="login-nik" maxlength="16" placeholder="Masukkan NIK" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Masukkan Password" required>
        <i class="fas fa-eye toggle-password" onclick="togglePass('login-password', this)"></i>
      </div>
      <button type="submit" class="btn">Masuk</button>
    </form>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="main-app" style="display: none;">
    <div class="app-header">
      <div class="user-info">
        <h3 id="user-nama">Nama User</h3>
        <p id="user-unit">Unit Kerja</p>
      </div>
    </div>

    <!-- HOME SECTION -->
    <div id="home-section" class="page-section active-section">
      <div class="clock-card">
        <div class="clock-date" id="current-date">--/--/----</div>
        <div class="clock-time" id="current-time">00:00:00</div>
      </div>

      <div class="status-container">
        <div class="status-box">
          <h4>Jam Masuk</h4>
          <p id="status-masuk">--:--:--</p>
        </div>
        <div class="status-box">
          <h4>Jam Pulang</h4>
          <p id="status-pulang">--:--:--</p>
        </div>
      </div>

      <div style="padding: 0 15px; font-weight: 600; font-size: 13px;">Lokasi GPS Saya:</div>
      <div id="map"></div>
    </div>

    <!-- REKAP SECTION -->
    <div id="rekap-section" class="page-section">
      <h3>Rekap Presensi</h3>
      <table id="rekap-table">
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Masuk</th>
            <th>Pulang</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data rekap akan diisi via JS -->
        </tbody>
      </table>
    </div>

    <!-- SETTING SECTION -->
    <div id="setting-section" class="page-section">
      <h3>Pengaturan Akun</h3>
      <form id="setting-form" style="margin-top: 15px;">
        <div class="form-group">
          <label>Password Lama</label>
          <input type="password" id="old-pass" required>
          <i class="fas fa-eye toggle-password" onclick="togglePass('old-pass', this)"></i>
        </div>
        <div class="form-group">
          <label>Password Baru</label>
          <input type="password" id="new-pass" required>
          <i class="fas fa-eye toggle-password" onclick="togglePass('new-pass', this)"></i>
        </div>
        <button type="submit" class="btn">Simpan Password</button>
      </form>
    </div>

    <!-- BOTTOM NAVBAR -->
    <div class="navbar">
      <button class="nav-item active" onclick="switchTab('home')">
        <i class="fas fa-home"></i>Home
      </button>
      <button class="nav-item" onclick="switchTab('rekap')">
        <i class="fas fa-history"></i>Rekap
      </button>
      <button class="nav-item finger-btn" onclick="openAbsenModal()">
        <i class="fas fa-fingerprint"></i>Absen
      </button>
      <button class="nav-item" onclick="switchTab('setting')">
        <i class="fas fa-cog"></i>Setting
      </button>
      <button class="nav-item" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i>Keluar
      </button>
    </div>
  </div>
</div>

<!-- CAMERA & ABSEN MODAL -->
<div id="absen-modal" class="modal">
  <div class="modal-content">
    <h3>Verifikasi Selfie Wajah</h3>
    <video id="video" autoplay playsinline></video>
    <div class="btn-group">
      <button class="btn btn-success" onclick="processAbsensi('masuk')">Oneclick Masuk</button>
      <button class="btn btn-success" onclick="processAbsensi('pulang')">Oneclick Pulang</button>
    </div>
    <div class="btn-group">
      <button class="btn btn-danger" onclick="closeAbsenModal()">Batal</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // GANTI SCRIPT URL DENGAN URL DEPLOY GOOGLE APPS SCRIPT ANDA
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";

  let currentUser = null;
  let currentLat = null;
  let currentLng = null;
  let map, marker;
  let videoStream = null;
  let currentDateStr = "";

  // Helper Post Data
  async function postData(data) {
    const response = await fetch(GAS_WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });
    return response.json();
  }

  // Toggle Password Visibility
  function togglePass(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
      input.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  }

  // Handle Login
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nik = document.getElementById('login-nik').value;
    const password = document.getElementById('login-password').value;

    const res = await postData({ action: 'login', nik, password });
    if (res.success) {
      currentUser = res.user;
      initApp();
    } else {
      alert(res.message);
    }
  });

  function initApp() {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    
    document.getElementById('user-nama').innerText = currentUser.nama;
    document.getElementById('user-unit').innerText = currentUser.unitKerja;

    initMap();
    startClock();
    loadTodayStatus();
    watchPosition();
  }

  // Clock & Automatic Server Time Sync
  function startClock() {
    async function updateTime() {
      const res = await postData({ action: 'getServerTime' });
      if (res.success) {
        document.getElementById('current-time').innerText = res.serverTime;
        document.getElementById('current-date').innerText = res.serverDate;
        
        // Auto refresh jika berganti tanggal
        if (currentDateStr !== "" && currentDateStr !== res.serverDate) {
          loadTodayStatus();
        }
        currentDateStr = res.serverDate;
      }
    }
    updateTime();
    setInterval(updateTime, 1000);
  }

  // Map & GPS Tracking
  function initMap() {
    map = L.map('map').setView([0, 0], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(map);
  }

  function watchPosition() {
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((pos) => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;

        const latLng = [currentLat, currentLng];
        map.setView(latLng, 16);

        if (marker) {
          marker.setLatLng(latLng);
        } else {
          marker = L.marker(latLng).addTo(map).bindPopup("Lokasi Saya").openPopup();
        }
      }, (err) => {
        console.warn("GPS error: " + err.message);
      }, { enableHighAccuracy: true });
    }
  }

  async function loadTodayStatus() {
    const res = await postData({ action: 'getTodayStatus', nik: currentUser.nik });
    if (res.success) {
      document.getElementById('status-masuk').innerText = res.jamMasuk;
      document.getElementById('status-pulang').innerText = res.jamPulang;
    }
  }

  // Tab Navigation
  function switchTab(tab) {
    document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active-section'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

    if (tab === 'home') {
      document.getElementById('home-section').classList.add('active-section');
      setTimeout(() => map.invalidateSize(), 200);
    } else if (tab === 'rekap') {
      document.getElementById('rekap-section').classList.add('active-section');
      loadRekap();
    } else if (tab === 'setting') {
      document.getElementById('setting-section').classList.add('active-section');
    }
    event.currentTarget.classList.add('active');
  }

  // Camera Selfie Modal
  async function openAbsenModal() {
    if (!currentLat || !currentLng) {
      alert("Lokasi GPS belum terdeteksi. Pastikan GPS aktif!");
      return;
    }
    document.getElementById('absen-modal').style.display = 'flex';
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      document.getElementById('video').srcObject = videoStream;
    } catch (err) {
      alert("Tidak dapat mengakses kamera!");
      closeAbsenModal();
    }
  }

  function closeAbsenModal() {
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById('absen-modal').style.display = 'none';
  }

  async function processAbsensi(type) {
    const res = await postData({
      action: 'absensi',
      nik: currentUser.nik,
      type: type,
      lat: currentLat,
      lng: currentLng
    });

    alert(res.message);
    if (res.success) {
      closeAbsenModal();
      loadTodayStatus();
    }
  }

  // Rekap Data
  async function loadRekap() {
    const res = await postData({ action: 'getRekap', nik: currentUser.nik });
    const tbody = document.querySelector('#rekap-table tbody');
    tbody.innerHTML = '';
    
    if (res.success && res.data.length > 0) {
      res.data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.tanggal}</td>
          <td>${item.jamMasuk}</td>
          <td>${item.jamPulang}</td>
        `;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = '<tr><td colspan="3">Belum ada data rekap</td></tr>';
    }
  }

  // Change Password
  document.getElementById('setting-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const oldPassword = document.getElementById('old-pass').value;
    const newPassword = document.getElementById('new-pass').value;

    const res = await postData({
      action: 'changePassword',
      nik: currentUser.nik,
      oldPassword,
      newPassword
    });

    alert(res.message);
    if (res.success) {
      document.getElementById('setting-form').reset();
    }
  });

  // Logout
  function logout() {
    currentUser = null;
    document.getElementById('main-app').style.display = 'none';
    document.getElementById('login-page').style.display = 'flex';
    document.getElementById('login-form').reset();
  }
</script>
</body>
</html>
