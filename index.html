<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    .header { background: #1e3c72; color: white; padding: 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
    .user-card { background: rgba(255,255,255,0.15); padding: 15px; border-radius: 12px; backdrop-filter: blur(5px); }
    .content { flex: 1; padding: 20px; padding-bottom: 90px; overflow-y: auto; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    .time-badge { font-size: 22px; font-weight: bold; color: #1e3c72; text-align: center; margin: 10px 0; }
    #map { height: 180px; width: 100%; border-radius: 10px; margin-top: 10px; }
    
    /* Bottom Nav Bar */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 480px; height: 65px; background: white; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #777; cursor: pointer; border: none; background: none; }
    .nav-item.active { color: #1e3c72; font-weight: bold; }
    .nav-item i { font-size: 18px; margin-bottom: 3px; }
    .fingerprint-btn { background: #1e3c72; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-top: -25px; box-shadow: 0 4px 10px rgba(30,60,114,0.4); border: 3px solid white; cursor: pointer; }
    .fingerprint-btn i { font-size: 26px; }

    /* Form & Input */
    .form-group { margin-bottom: 15px; position: relative; }
    .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    .toggle-pass { position: absolute; right: 12px; top: 35px; cursor: pointer; color: #777; }
    .btn { width: 100%; padding: 12px; background: #1e3c72; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }

    /* Submenu Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 15px; text-align: center; }
    video { width: 100%; border-radius: 10px; margin: 10px 0; background: #000; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- LOGIN SECTION -->
  <div id="loginSection" class="content" style="display: flex; flex-direction: column; justify-content: center;">
    <h2 style="text-align: center; color: #1e3c72; margin-bottom: 25px;">ABSENSI ONLINE</h2>
    <div class="card">
      <div class="form-group">
        <label>NIK (16 Digit)</label>
        <input type="text" id="loginNik" maxlength="16" placeholder="Masukkan NIK">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Masukkan Password">
        <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword('loginPassword', this)"></i>
      </div>
      <button class="btn" onclick="handleLogin()">Masuk</button>
    </div>
  </div>

  <!-- MAIN APP SECTION -->
  <div id="appSection" style="display: none; height: 100%;">
    <div class="header">
      <div class="user-card">
        <h3 id="dispNama">-</h3>
        <p id="dispUnit" style="font-size: 13px; opacity: 0.9;">-</p>
        <p id="dispNik" style="font-size: 12px; opacity: 0.8; margin-top: 4px;">NIK: -</p>
      </div>
    </div>

    <!-- TAB: UTAMA -->
    <div id="tabUtama" class="content">
      <div class="card">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #555;">
          <span>Tanggal Server: <b id="dispTanggal">-</b></span>
          <span>Jam Server: <b id="dispServerTime">-</b></span>
        </div>
      </div>

      <div class="card" style="display: flex; justify-content: space-around;">
        <div style="text-align: center;">
          <small style="color: #666;">Jam Masuk</small>
          <div class="time-badge" id="dispMasuk">--:--</div>
        </div>
        <div style="border-left: 1px solid #eee;"></div>
        <div style="text-align: center;">
          <small style="color: #666;">Jam Pulang</small>
          <div class="time-badge" id="dispPulang">--:--</div>
        </div>
      </div>

      <div class="card">
        <small style="color: #666;">Lokasi GPS & Peta</small>
        <p id="dispCoord" style="font-size: 12px; font-weight: bold; margin-top: 4px;">Mencari lokasi...</p>
        <div id="map"></div>
      </div>
    </div>

    <!-- TAB: REKAP -->
    <div id="tabRekap" class="content" style="display: none;">
      <h3>Rekap Presensi</h3>
      <div id="rekapList" style="margin-top: 15px;"></div>
    </div>

    <!-- TAB: SETTING -->
    <div id="tabSetting" class="content" style="display: none;">
      <h3>Pengaturan Profil</h3>
      <div class="card" style="margin-top: 15px;">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="editNama">
        </div>
        <div class="form-group">
          <label>Unit Kerja</label>
          <input type="text" id="editUnit">
        </div>
        <div class="form-group">
          <label>Password Baru</label>
          <input type="password" id="editPassword">
          <i class="fa-solid fa-eye toggle-pass" onclick="togglePassword('editPassword', this)"></i>
        </div>
        <button class="btn" onclick="saveSettings()">Simpan Perubahan</button>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('tabUtama', this)">
        <i class="fa-solid fa-house"></i>
        <span>Utama</span>
      </button>
      <button class="nav-item" onclick="switchTab('tabRekap', this)">
        <i class="fa-solid fa-calendar-check"></i>
        <span>Rekap</span>
      </button>
      <div class="fingerprint-btn" onclick="openAbsenModal()">
        <i class="fa-solid fa-fingerprint"></i>
      </div>
      <button class="nav-item" onclick="switchTab('tabSetting', this)">
        <i class="fa-solid fa-gear"></i>
        <span>Setting</span>
      </button>
      <button class="nav-item" onclick="handleLogout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Keluar</span>
      </button>
    </div>
  </div>
</div>

<!-- MODAL CAMERA ABSEN -->
<div id="absenModal" class="modal">
  <div class="modal-content">
    <h4>Verifikasi Wajah & Selfie</h4>
    <video id="webcam" autoplay playsinline></video>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn" style="background: #28a745;" onclick="submitAbsen('masuk')">Absen Masuk</button>
      <button class="btn" style="background: #dc3545;" onclick="submitAbsen('pulang')">Absen Pulang</button>
    </div>
    <button class="btn" style="background: #6c757d; margin-top: 8px;" onclick="closeAbsenModal()">Batal</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // GANTI LINK DI BAWAH DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA
  const API_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";

  let currentUser = null;
  let map, marker;
  let currentLat = 0, currentLng = 0;
  let mediaStream = null;

  // Visual Customization: menyembunyikan alamat URL jika diembed
  if (window.self !== window.top) {
    document.body.style.padding = "0";
  }

  function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
      input.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.replace("fa-slash", "fa-eye");
    }
  }

  async function apiCall(data) {
    const response = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });
    return response.json();
  }

  async function handleLogin() {
    const nik = document.getElementById("loginNik").value;
    const password = document.getElementById("loginPassword").value;
    if (!nik || !password) return alert("Isi NIK dan Password!");

    const res = await apiCall({ action: "login", nik: nik, password: password });
    if (res.status === "success") {
      currentUser = res.user;
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("appSection").style.display = "block";
      initApp();
    } else {
      alert(res.message);
    }
  }

  function handleLogout() {
    currentUser = null;
    document.getElementById("appSection").style.display = "none";
    document.getElementById("loginSection").style.display = "flex";
  }

  function initApp() {
    document.getElementById("dispNama").innerText = currentUser.nama;
    document.getElementById("dispUnit").innerText = currentUser.unitKerja;
    document.getElementById("dispNik").innerText = "NIK: " + currentUser.nik;

    document.getElementById("editNama").value = currentUser.nama;
    document.getElementById("editUnit").value = currentUser.unitKerja;

    fetchServerTime();
    initGPS();
    loadRekap();
    
    // Auto Refresh Waktu & Pergantian Hari
    setInterval(fetchServerTime, 60000);
  }

  async function fetchServerTime() {
    const res = await apiCall({ action: "getSystemTime" });
    if (res.status === "success") {
      document.getElementById("dispServerTime").innerText = res.serverTime;
      document.getElementById("dispTanggal").innerText = res.serverDate;
    }
  }

  function initGPS() {
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((pos) => {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        document.getElementById("dispCoord").innerText = `${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;

        if (!map) {
          map = L.map('map').setView([currentLat, currentLng], 16);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          marker = L.marker([currentLat, currentLng]).addTo(map);
        } else {
          marker.setLatLng([currentLat, currentLng]);
          map.panTo([currentLat, currentLng]);
        }
      }, (err) => alert("Gagal mengambil lokasi GPS! Pastikan GPS aktif."), { enableHighAccuracy: true });
    }
  }

  function switchTab(tabId, el) {
    document.querySelectorAll('.content').forEach(c => c.style.display = 'none');
    document.getElementById(tabId).style.display = 'block';
    
    if(el) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
    }
  }

  async function openAbsenModal() {
    document.getElementById("absenModal").style.display = "flex";
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      document.getElementById("webcam").srcObject = mediaStream;
    } catch (e) {
      alert("Akses kamera ditolak/tidak tersedia!");
      closeAbsenModal();
    }
  }

  function closeAbsenModal() {
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById("absenModal").style.display = "none";
  }

  async function submitAbsen(type) {
    if (!currentLat || !currentLng) return alert("Lokasi GPS belum ditemukan!");
    
    const actionType = type === 'masuk' ? 'absenMasuk' : 'absenPulang';
    const res = await apiCall({
      action: actionType,
      nik: currentUser.nik,
      currentLat: currentLat,
      currentLng: currentLng
    });

    if (res.status === "success") {
      alert(res.message);
      if (type === 'masuk') document.getElementById("dispMasuk").innerText = res.time;
      if (type === 'pulang') document.getElementById("dispPulang").innerText = res.time;
      closeAbsenModal();
      loadRekap();
    } else {
      alert(res.message);
    }
  }

  async function loadRekap() {
    const res = await apiCall({ action: "getRekap", nik: currentUser.nik });
    if (res.status === "success") {
      const container = document.getElementById("rekapList");
      container.innerHTML = "";
      res.logs.forEach(item => {
        container.innerHTML += `
          <div class="card" style="font-size:13px;">
            <b>${item.tanggal}</b><br>
            Masuk: ${item.jamMasuk} | Pulang: ${item.jamPulang}<br>
            <small style="color:#777;">GPS: ${item.koordinat}</small>
          </div>
        `;
      });
    }
  }

  async function saveSettings() {
    const newPass = document.getElementById("editPassword").value;
    const newNama = document.getElementById("editNama").value;
    const newUnit = document.getElementById("editUnit").value;

    const res = await apiCall({
      action: "updateProfile",
      nik: currentUser.nik,
      newPassword: newPass,
      nama: newNama,
      unitKerja: newUnit
    });

    if (res.status === "success") {
      alert("Profil berhasil diubah!");
      currentUser.nama = newNama;
      currentUser.unitKerja = newUnit;
      initApp();
    } else {
      alert(res.message);
    }
  }
</script>
</body>
</html>
