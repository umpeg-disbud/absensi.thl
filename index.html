<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Absensi Online</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet Map CSS/JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    #map { height: 180px; width: 100%; border-radius: 0.75rem; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-20">

  <!-- CONFIGURATION -->
  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx61vxfuOADnwrwX2qoWte3ghgcQjNSrNoIXZdCDVuqAqV7WuNlvgg26vq1GchjKEmGyQ/exec";
  </script>

  <!-- Notification Toast (No Alert / Embedded Popups) -->
  <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white px-4 py-2 rounded-lg shadow-lg text-sm transition-all duration-300"></div>

  <!-- HALAMAN LOGIN -->
  <div id="pageLogin" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6">
      <div class="text-center mb-6">
        <i class="fa-solid fa-user-check text-4xl text-blue-600 mb-2"></i>
        <h2 class="text-2xl font-bold text-gray-800">Absensi Online</h2>
        <p class="text-sm text-gray-500">Silakan login dengan NIK & Password</p>
      </div>
      <form id="loginForm" class="space-y-4" onsubmit="event.preventDefault(); doLogin();">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">NIK (16 Digit)</label>
          <input type="number" id="loginNik" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Masukkan 16 digit NIK">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="loginPass" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm pr-10" placeholder="Masukkan Password">
            <button type="button" onclick="togglePass('loginPass', 'eyeIconLogin')" class="absolute right-3 top-2.5 text-gray-400">
              <i id="eyeIconLogin" class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow transition">Masuk</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER (Hidden Default) -->
  <div id="appContainer" class="hidden max-w-md mx-auto">

    <!-- SUB-HALAMAN: UTAMA / DASHBOARD -->
    <div id="tabHome" class="p-4 space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex justify-between items-center">
        <div>
          <h1 id="userNama" class="text-lg font-bold text-gray-800">Loading...</h1>
          <p id="userUnit" class="text-xs text-gray-500">Loading...</p>
        </div>
        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-full" id="displayDate">--/--/----</span>
      </div>

      <!-- Jam Digital Server -->
      <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 text-white text-center shadow-md">
        <p class="text-xs tracking-wider uppercase opacity-80 mb-1">Waktu Server Saat Ini</p>
        <div id="displayTime" class="text-4xl font-extrabold tracking-tight">00:00:00</div>
      </div>

      <!-- Detail Status Absen Hari Ini -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm text-center">
          <p class="text-xs text-gray-400 font-medium">Jam Masuk</p>
          <p id="jamMasukVal" class="text-lg font-bold text-emerald-600 mt-1">--:--:--</p>
        </div>
        <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm text-center">
          <p class="text-xs text-gray-400 font-medium">Jam Pulang</p>
          <p id="jamPulangVal" class="text-lg font-bold text-rose-600 mt-1">--:--:--</p>
        </div>
      </div>

      <!-- Lokasi Koordinat GPS & Peta -->
      <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-semibold text-gray-600"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i> Titik Koordinat</span>
          <span id="gpsStatus" class="text-[10px] text-gray-400">Menghubungkan GPS...</span>
        </div>
        <div id="map"></div>
      </div>
    </div>

    <!-- SUB-HALAMAN: REKAP PRESENSI -->
    <div id="tabRekap" class="hidden p-4 space-y-3">
      <h2 class="text-lg font-bold text-gray-800 mb-2">Rekap Absensi Saya</h2>
      <div id="rekapList" class="space-y-2"></div>
    </div>

    <!-- SUB-HALAMAN: SETTING -->
    <div id="tabSetting" class="hidden p-4 space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Pengaturan Akun</h2>
        <form onsubmit="event.preventDefault(); doChangePassword();" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Password Lama</label>
            <div class="relative">
              <input type="password" id="oldPass" required class="w-full px-3 py-2 border rounded-lg text-sm pr-10">
              <button type="button" onclick="togglePass('oldPass', 'eyeOld')" class="absolute right-3 top-2.5 text-gray-400">
                <i id="eyeOld" class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Password Baru</label>
            <div class="relative">
              <input type="password" id="newPass" required class="w-full px-3 py-2 border rounded-lg text-sm pr-10">
              <button type="button" onclick="togglePass('newPass', 'eyeNew')" class="absolute right-3 top-2.5 text-gray-400">
                <i id="eyeNew" class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg text-sm mt-2">Update Password</button>
        </form>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <div class="bottom-nav bg-white border-t border-gray-200 max-w-md mx-auto flex justify-around items-center h-16 px-2">
      <button onclick="switchTab('rekap')" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
        <span class="text-[10px] mt-1">Rekap</span>
      </button>
      
      <!-- Tombol Sidik Jari / Absensi Modal -->
      <button onclick="openAbsenModal()" class="flex flex-col items-center justify-center -mt-6 bg-blue-600 text-white rounded-full w-14 h-14 shadow-lg border-4 border-gray-100 hover:bg-blue-700">
        <i class="fa-solid fa-fingerprint text-2xl"></i>
      </button>

      <button onclick="switchTab('setting')" class="flex flex-col items-center text-gray-500 hover:text-blue-600">
        <i class="fa-solid fa-gear text-lg"></i>
        <span class="text-[10px] mt-1">Setting</span>
      </button>

      <button onclick="doLogout()" class="flex flex-col items-center text-gray-500 hover:text-rose-600">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
        <span class="text-[10px] mt-1">Keluar</span>
      </button>
    </div>
  </div>

  <!-- MODAL KAMERA & ABSENSI -->
  <div id="absenModal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl p-4 space-y-3 text-center">
      <h3 class="font-bold text-gray-800 text-sm">Selfie Wajah Absensi</h3>
      <div class="relative bg-black rounded-lg overflow-hidden h-56 flex items-center justify-center">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
        <canvas id="canvas" class="hidden"></canvas>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="doAbsen('masuk')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg text-xs flex items-center justify-center gap-1">
          <i class="fa-solid fa-right-to-bracket"></i> Jam Masuk
        </button>
        <button onclick="doAbsen('pulang')" class="bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2 rounded-lg text-xs flex items-center justify-center gap-1">
          <i class="fa-solid fa-right-from-bracket"></i> Jam Pulang
        </button>
      </div>
      <button onclick="closeAbsenModal()" class="text-xs text-gray-400 hover:underline pt-1">Batal</button>
    </div>
  </div>

  <!-- SCRIPT FRONTEND LOGIC -->
  <script>
    let currentUser = null;
    let currentLat = 0;
    let currentLng = 0;
    let map = null, marker = null;
    let clockInterval = null;
    let currentDateStr = "";

    // Toast Notification helper (Replacing alert / popups)
    function showToast(msg, duration = 3000) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), duration);
    }

    // Toggle Password Visibility
    function togglePass(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === "password") {
        input.type = "text";
        icon.className = "fa-regular fa-eye-slash";
      } else {
        input.type = "password";
        icon.className = "fa-regular fa-eye";
      }
    }

    // Login Function
    async function doLogin() {
      const nik = document.getElementById('loginNik').value;
      const pass = document.getElementById('loginPass').value;

      showToast("Sedang verifikasi login...");
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', nik: nik, password: pass })
        }).then(r => r.json());

        if (res.status === "success") {
          currentUser = res.user;
          localStorage.setItem('user_nik', nik);
          initApp();
        } else {
          showToast(res.message);
        }
      } catch (err) {
        showToast("Gagal terhubung ke server!");
      }
    }

    // Init App setelah Login
    function initApp() {
      document.getElementById('pageLogin').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      initMap();
      startGPS();
      loadDashboard();
      
      // Auto refresh saat ganti hari
      setInterval(() => {
        const nowStr = new Date().toLocaleDateString('id-ID');
        if (currentDateStr && currentDateStr !== nowStr) {
          location.reload();
        }
      }, 10000);
    }

    // Load Dashboard Data
    async function loadDashboard() {
      const nik = currentUser ? currentUser.nik : localStorage.getItem('user_nik');
      if (!nik) return;

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getDashboard', nik: nik })
        }).then(r => r.json());

        if (res.status === "success") {
          currentUser = res.user;
          document.getElementById('userNama').innerText = currentUser.nama;
          document.getElementById('userUnit').innerText = currentUser.unitKerja;
          document.getElementById('displayDate').innerText = res.serverDate;
          document.getElementById('jamMasukVal').innerText = res.jamMasuk;
          document.getElementById('jamPulangVal').innerText = res.jamPulang;

          currentDateStr = new Date().toLocaleDateString('id-ID');
          startClock(res.serverTime);
        }
      } catch (e) {
        showToast("Gagal memuat data dashboard.");
      }
    }

    // Live Jam Digital berdasarkan waktu server
    function startClock(serverTimeStr) {
      if (clockInterval) clearInterval(clockInterval);
      const parts = serverTimeStr.split(":");
      let date = new Date();
      date.setHours(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));

      clockInterval = setInterval(() => {
        date.setSeconds(date.getSeconds() + 1);
        const hh = String(date.getHours()).padStart(2, '0');
        const mm = String(date.getMinutes()).padStart(2, '0');
        const ss = String(date.getSeconds()).padStart(2, '0');
        document.getElementById('displayTime').innerText = `${hh}:${mm}:${ss}`;
      }, 1000);
    }

    // Inisialisasi Peta GPS (Leaflet JS)
    function initMap() {
      if (!map) {
        map = L.map('map').setView([0, 0], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(map);
      }
    }

    // Automatic Continuous GPS Tracking
    function startGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition((pos) => {
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          
          document.getElementById('gpsStatus').innerText = `${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;

          if (map) {
            map.setView([currentLat, currentLng], 16);
            if (marker) {
              marker.setLatLng([currentLat, currentLng]);
            } else {
              marker = L.marker([currentLat, currentLng]).addTo(map);
            }
          }
        }, (err) => {
          document.getElementById('gpsStatus').innerText = "Akses GPS Ditolak/Gagal";
        }, { enableHighAccuracy: true });
      }
    }

    // Modal & Kamera selfie
    let videoStream = null;
    async function openAbsenModal() {
      document.getElementById('absenModal').classList.remove('hidden');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        document.getElementById('webcam').srcObject = videoStream;
      } catch (err) {
        showToast("Kamera gagal diakses!");
      }
    }

    function closeAbsenModal() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('absenModal').classList.add('hidden');
    }

    // One-Click Absen
    async function doAbsen(type) {
      if (!currentLat || !currentLng) {
        showToast("Posisi GPS belum terdeteksi!");
        return;
      }

      // Ambil gambar selfie dari canvas
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth || 300;
      canvas.height = video.videoHeight || 300;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = canvas.toDataURL('image/jpeg', 0.5);

      closeAbsenModal();
      showToast("Memproses Absensi...");

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'submitAbsen',
            nik: currentUser.nik,
            type: type,
            lat: currentLat,
            lng: currentLng,
            image: imgData
          })
        }).then(r => r.json());

        if (res.status === "success") {
          showToast(res.message);
          if (type === 'masuk') document.getElementById('jamMasukVal').innerText = res.time;
          if (type === 'pulang') document.getElementById('jamPulangVal').innerText = res.time;
        } else {
          showToast(res.message);
        }
      } catch (e) {
        showToast("Gagal mengirim absensi!");
      }
    }

    // Tab Navigation & Rekap
    function switchTab(tab) {
      document.getElementById('tabHome').classList.add('hidden');
      document.getElementById('tabRekap').classList.add('hidden');
      document.getElementById('tabSetting').classList.add('hidden');

      if (tab === 'home') document.getElementById('tabHome').classList.remove('hidden');
      if (tab === 'rekap') {
        document.getElementById('tabRekap').classList.remove('hidden');
        loadRekap();
      }
      if (tab === 'setting') document.getElementById('tabSetting').classList.remove('hidden');
    }

    async function loadRekap() {
      showToast("Memuat rekap...");
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getRekap', nik: currentUser.nik })
        }).then(r => r.json());

        if (res.status === "success") {
          const list = document.getElementById('rekapList');
          list.innerHTML = "";
          res.rekap.forEach(item => {
            list.innerHTML += `
              <div class="bg-white p-3 rounded-lg border border-gray-100 flex justify-between items-center text-xs">
                <div>
                  <p class="font-bold text-gray-700">${item.tanggal}</p>
                </div>
                <div class="text-right">
                  <span class="text-emerald-600 font-semibold">M: ${item.jamMasuk}</span> | 
                  <span class="text-rose-600 font-semibold">P: ${item.jamPulang}</span>
                </div>
              </div>
            `;
          });
        }
      } catch (e) {
        showToast("Gagal memuat rekap.");
      }
    }

    // Update Password
    async function doChangePassword() {
      const oldPass = document.getElementById('oldPass').value;
      const newPass = document.getElementById('newPass').value;

      showToast("Updating password...");
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'changePassword',
            nik: currentUser.nik,
            oldPassword: oldPass,
            newPassword: newPass
          })
        }).then(r => r.json());

        showToast(res.message);
        if (res.status === "success") {
          document.getElementById('oldPass').value = "";
          document.getElementById('newPass').value = "";
        }
      } catch (e) {
        showToast("Gagal mengganti password!");
      }
    }

    // Logout
    function doLogout() {
      localStorage.removeItem('user_nik');
      location.reload();
    }

    // Auto Login Check
    window.onload = () => {
      const savedNik = localStorage.getItem('user_nik');
      if (savedNik) {
        currentUser = { nik: savedNik };
        initApp();
      }
    };
  </script>
</body>
</html>
